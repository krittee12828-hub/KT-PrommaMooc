<!DOCTYPE html>
<html lang="th">
<head>

<title>PrommaMooc</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2326418f'/%3E%3Ctext x='30' y='45' font-size='38' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3EP%3C/text%3E%3Ccircle cx='53' cy='53' r='11' fill='%23f2a900'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="base-css">
/* PrommaMooc — styles
   Design: deep indigo + marigold. One signature motif — the learning route (nodes joined by a line) —
   reused on the home hero, course cards, course outline and the lesson sidebar. */
:root{
  --primary:#26418f; --primary-600:#1f3677; --primary-700:#182a5c; --primary-100:#dde4f6; --primary-50:#eef2fb; --on-primary:#fff;
  --deep:#0f1a45; --deep-2:#16235a;
  --accent:#f2a900; --accent-100:#fff0c9; --accent-ink:#6d4a00;
  --ink:#14203a; --ink-2:#47536f; --ink-3:#77829c;
  --paper:#f4f6fb; --surface:#fff; --line:#dfe4ef; --line-2:#cbd2e3;
  --ok:#17825a; --ok-bg:#e2f4ec; --bad:#c23b3b; --bad-bg:#fcebeb; --warn:#9a5b00; --warn-bg:#fff4dc;
  --r:16px; --r-sm:10px;
  --lift:0 18px 50px rgba(15,26,69,.16);
  --head:'Prompt','Sukhumvit Set','Thonburi','Tahoma',system-ui,sans-serif;
  --body:'Sarabun','Sukhumvit Set','Thonburi','Tahoma',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;touch-action:manipulation}
body.modal-open{overflow:hidden}
h1,h2,h3,h4{font-family:var(--head);line-height:1.38;margin:0 0 .5em;font-weight:600;color:var(--ink);letter-spacing:-.005em}
h1{font-size:clamp(1.8rem,3.6vw,2.6rem);line-height:1.3}
h2{font-size:1.4rem}
h3{font-size:1.12rem}
p{margin:0 0 1em}
a{color:var(--primary);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--primary-600)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent);color:#2b2000}
.ic{flex:none;vertical-align:-.2em}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.center{text-align:center}
.hide{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1}
.mt{margin-top:18px}.mt-s{margin-top:8px}.mb{margin-bottom:18px}.mb-0{margin-bottom:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.s-short{display:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.5) blur(10px);-webkit-backdrop-filter:saturate(1.5) blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;min-height:66px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);font-family:var(--head);font-weight:600;font-size:1.2rem;letter-spacing:-.01em}
.brand:hover{color:var(--ink)}
.mark{width:38px;height:38px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;position:relative;overflow:hidden;font-size:1.1rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.mark::after{content:"";position:absolute;right:-6px;bottom:-6px;width:16px;height:16px;border-radius:50%;background:var(--accent)}
.mark img{width:100%;height:100%;object-fit:cover}
.mark:has(img)::after{display:none}
.nav{display:flex;gap:2px;margin-left:10px}
.nav a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.nav a:hover{background:var(--primary-50);color:var(--primary)}
.nav a.on{color:var(--primary);background:var(--primary-50);font-weight:600}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.bar .btn{white-space:nowrap}
.user-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 16px 4px 4px;cursor:pointer;min-height:46px;max-width:250px;transition:border-color .15s}
.user-chip:hover{border-color:var(--primary)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#2b2000;display:grid;place-items:center;font-weight:700;font-family:var(--head);flex:none}
.user-chip span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--primary-50);color:var(--primary)}
.icon-btn[disabled]{opacity:.35;pointer-events:none}
main{min-height:60vh;padding-bottom:64px}
.footer{background:var(--deep);border-top:4px solid var(--accent);padding:30px 0;color:rgba(255,255,255,.7);font-size:.92rem}
.footer .wrap{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:center}
.footer b{color:#fff;font-family:var(--head);font-weight:600;font-size:1.05rem}
.footer a{color:#fff;text-decoration-color:rgba(255,255,255,.4)}
.footer a:hover{color:var(--accent)}

/* ---------- buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:12px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;font-size:1rem;line-height:1.2;transition:background .15s,border-color .15s,box-shadow .15s,transform .05s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:0 2px 0 var(--primary-700)}
.btn.primary:hover{background:var(--primary-600);border-color:var(--primary-600);color:var(--on-primary)}
.btn.primary:active{box-shadow:none}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#2b2000;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.accent:hover{filter:brightness(.96);color:#2b2000;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger:hover{filter:brightness(.92);color:#fff;border-color:var(--bad)}
.btn.danger-o{color:var(--bad);border-color:#e7bcbc}
.btn.danger-o:hover{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:38px;padding:0 15px;font-size:.93rem;border-radius:10px}
.btn.lg{min-height:56px;padding:0 30px;font-size:1.08rem;border-radius:14px}
.btn[disabled],.btn.disabled{opacity:.5;pointer-events:none;box-shadow:none}
.field{display:block;margin-bottom:14px}
.field>span.lb{display:block;font-weight:600;margin-bottom:5px;font-size:.95rem}
.help{display:block;color:var(--ink-3);font-size:.85rem;margin-top:4px;line-height:1.5}
input[type=text],input[type=url],input[type=email],input[type=tel],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;min-height:46px;padding:9px 14px;border:1px solid var(--line-2);border-radius:11px;background:#fff;font-size:1rem;line-height:1.5;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-100)}
input[type=color]{width:56px;height:46px;padding:3px;border:1px solid var(--line-2);border-radius:11px;background:#fff;cursor:pointer}
.check{display:flex;gap:11px;align-items:flex-start;margin-bottom:12px;cursor:pointer;line-height:1.5}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--primary);flex:none}
.check b{font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.panel+.panel{margin-top:16px}
.panel h2:first-child,.panel h3:first-child{margin-top:0}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 11px;border-radius:999px;background:var(--primary-50);color:var(--primary-700);font-size:.82rem;font-weight:600;line-height:1.6;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.gold{background:var(--accent-100);color:var(--accent-ink)}
.tag.gray{background:#eceff5;color:var(--ink-2)}
.callout{display:flex;gap:12px;padding:14px 18px;border-radius:14px;background:var(--primary-50);border:1px solid var(--primary-100);margin:0 0 16px;line-height:1.55}
.callout.ok{background:var(--ok-bg);border-color:#bfe5d3}
.callout.warn{background:var(--warn-bg);border-color:#f2d9a0}
.callout.bad{background:var(--bad-bg);border-color:#efc3c3}
.callout .ic{margin-top:3px}
.bar-progress{height:8px;border-radius:99px;background:var(--primary-100);overflow:hidden}
.bar-progress i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.bar-progress.ok i{background:var(--ok)}

/* ---------- home hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--deep);color:#fff;padding:60px 0 72px}
.hero-art{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.hero-art svg{width:100%;height:100%;display:block}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:52px;align-items:center}
.hero h1{color:#fff;font-size:clamp(2.05rem,4.6vw,3.35rem);line-height:1.28;letter-spacing:-.015em;margin-bottom:.4em}
.hero .lead{color:rgba(255,255,255,.8);font-size:1.15rem;max-width:32em}
.hero .muted{color:rgba(255,255,255,.78)}
.search{display:block;position:relative;max-width:540px;margin-top:26px}
.search .ic{position:absolute;left:17px;top:50%;margin-top:-10px;color:var(--ink-3);z-index:1}
.search input{padding-left:48px;min-height:58px;border-radius:16px;font-size:1.05rem;border:0;box-shadow:0 10px 34px rgba(0,0,0,.28)}
.search input:focus{box-shadow:0 10px 34px rgba(0,0,0,.28),0 0 0 4px rgba(242,169,0,.55)}
.hero-stats{display:flex;gap:6px 26px;flex-wrap:wrap;margin-top:22px;color:rgba(255,255,255,.7);font-size:.95rem}
.hero-stats b{color:#fff;font-family:var(--head);font-weight:600;font-size:1.3rem;margin-right:5px}
.how{background:#fff;color:var(--ink);border-radius:22px;padding:26px 26px 10px;box-shadow:0 28px 70px rgba(0,0,0,.34)}
.how h3{font-size:.98rem;color:var(--ink-2);font-weight:500;margin-bottom:18px}
.rise{animation:rise .75s cubic-bezier(.2,.7,.2,1) both}
.r1{animation-delay:.04s}.r2{animation-delay:.16s}.r3{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* ---------- catalog ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:40px 0 4px}
.sec-h h2{margin:0;font-size:1.5rem}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.cat{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 18px;cursor:pointer;font-weight:500;min-height:42px;color:var(--ink-2);transition:all .15s}
.cat:hover{border-color:var(--primary);color:var(--primary)}
.cat.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
.cc{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:border-color .18s,box-shadow .18s,transform .18s}
.cc:hover{border-color:var(--primary);box-shadow:var(--lift);transform:translateY(-3px);color:inherit}
.cover{aspect-ratio:16/9;min-height:120px;background:var(--primary);display:grid;place-items:center;position:relative;overflow:hidden;color:#fff;isolation:isolate}
.cover .em{position:relative;z-index:1;width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:2.7rem;line-height:1;box-shadow:0 0 0 10px rgba(255,255,255,.07)}
.cover img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:2}
.cover .draft{position:absolute;left:12px;top:12px;z-index:3}
.cover .done{position:absolute;right:12px;top:12px;z-index:3}
.cv0{background:var(--primary) radial-gradient(rgba(255,255,255,.14) 1.6px,transparent 1.8px) 0 0/20px 20px}
.cv1{background:var(--deep-2) repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 15px)}
.cv2{background:var(--accent) radial-gradient(rgba(0,0,0,.09) 1.6px,transparent 1.8px) 0 0/20px 20px;color:#2b2000}
.cv2 .em{background:rgba(255,255,255,.42);box-shadow:0 0 0 10px rgba(255,255,255,.22)}
.cv3{background:var(--primary-600) repeating-radial-gradient(circle at 82% 18%,rgba(255,255,255,.09) 0 2px,transparent 2px 24px)}
.cc-b{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.cc-b h3{margin:0;font-size:1.12rem;line-height:1.42}
.cc-b .meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink-2);font-size:.88rem;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line);}
.cc-b .meta span{display:inline-flex;gap:5px;align-items:center}
.prog{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:4px}
.dots{display:flex;align-items:center;flex-wrap:wrap;row-gap:6px}
.dots i{position:relative;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line-2);margin-left:10px;flex:none}
.dots i:first-child{margin-left:0}
.dots i.t{border-radius:4px}
.dots i+i::before{content:"";position:absolute;right:100%;top:50%;width:10px;height:2px;margin-top:-1px;background:var(--line-2)}
.dots i.d{background:var(--primary);border-color:var(--primary)}
.dots i.d+i::before{background:var(--primary)}
.dots i.n{border-color:var(--accent);background:var(--accent-100);box-shadow:0 0 0 3px rgba(242,169,0,.2)}
.empty{text-align:center;padding:60px 20px;color:var(--ink-2);background:#fff;border:1px dashed var(--line-2);border-radius:var(--r)}
.empty .big{font-size:2.6rem;margin-bottom:6px}

/* ---------- learning route (signature element) ---------- */
.path{list-style:none;margin:0;padding:0}
.path>li{position:relative;padding:0 0 0 56px;min-height:58px}
.path>li:not(:last-child)::before{content:"";position:absolute;left:18px;top:42px;bottom:-4px;width:2px;background:repeating-linear-gradient(to bottom,var(--line-2) 0 5px,transparent 5px 9px)}
.path>li.is-done:not(:last-child)::before{background:var(--primary)}
.nd{position:absolute;left:0;top:2px;width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid var(--line-2);display:grid;place-items:center;color:var(--ink-3);font-family:var(--head);font-weight:600;font-size:.92rem;transition:all .2s}
.nd.test{border-radius:11px}
.is-done .nd{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.is-now .nd{border-color:var(--accent);background:var(--accent-100);color:var(--accent-ink);box-shadow:0 0 0 5px rgba(242,169,0,.2)}
.is-lock .nd{background:#f1f3f8}
.nd.cert{border-color:var(--accent);color:var(--accent-ink)}
.is-done .nd.cert{background:var(--accent);border-color:var(--accent);color:#2b2000}
.pi{display:block;padding:4px 0 22px;min-width:0}
.pi .t{font-weight:600;line-height:1.42;display:block;color:var(--ink)}
.pi .s{display:block;color:var(--ink-2);font-size:.88rem;line-height:1.5;margin-top:2px}
.path a.pi{text-decoration:none;color:inherit}
.path a.pi:hover .t{color:var(--primary)}
.path a.pi[aria-current=page] .t{color:var(--primary)}
.path li:has(>a[aria-current=page]) .nd{border-color:var(--primary);box-shadow:0 0 0 5px var(--primary-100)}
.is-lock .pi .t{color:var(--ink-3);font-weight:500}
.how .path>li{min-height:0}
.how .pi{padding-bottom:20px}

/* ---------- course detail ---------- */
.dhead{position:relative;overflow:hidden;background:var(--deep) radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.7px) 0 0/24px 24px;color:#fff;padding:30px 0 124px}
.dhead::after{content:"";position:absolute;right:-90px;top:-110px;width:380px;height:380px;border-radius:50%;border:2px solid rgba(255,255,255,.08);box-shadow:0 0 0 46px rgba(255,255,255,.03),0 0 0 92px rgba(255,255,255,.02)}
.dhead .wrap{position:relative;z-index:1}
.dhead h1{color:#fff;max-width:20em}
.dhead .muted{color:rgba(255,255,255,.8)}
.dhead .muted b{color:#fff}
.dhead .tag{background:rgba(255,255,255,.14);color:#fff}
.dhead .tag.gray{background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.dhead .tag.warn{background:var(--accent);color:#2b2000}
.crumbs{font-size:.9rem;color:var(--ink-2);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a{color:var(--ink-2);text-decoration:none}
.crumbs a:hover{color:var(--primary);text-decoration:underline}
.dhead .crumbs,.dhead .crumbs a{color:rgba(255,255,255,.72)}
.dhead .crumbs a:hover{color:#fff}
.dgrid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:30px;margin-top:-92px;align-items:start}
.side-card{position:sticky;top:84px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--lift)}
.side-card .cover{border-radius:12px;margin-bottom:18px}
.facts{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:9px;color:var(--ink-2);font-size:.95rem}
.facts li{display:flex;gap:10px;align-items:center}
.facts .ic{color:var(--primary)}
.desc{color:var(--ink-2)}

/* ---------- learn ---------- */
.learn{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:30px;padding-top:26px;align-items:start}
.main-col h1{font-size:clamp(1.5rem,3vw,2rem);margin-bottom:.6em}
.outline{position:sticky;top:86px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 20px 8px;max-height:calc(100vh - 104px);overflow:auto;box-shadow:0 8px 30px rgba(15,26,69,.06)}
.outline h3{font-size:1rem;margin-bottom:8px;line-height:1.45}
.outline .bar-progress{margin:8px 0 22px}
.outline .path>li{padding-left:50px}
.outline .nd{width:34px;height:34px;font-size:.84rem}
.outline .path>li:not(:last-child)::before{left:16px;top:38px}
.outline .pi{padding-bottom:22px}
.outline .pi .t{font-size:.97rem}
.player-wrap{position:relative;padding-top:56.25%;background:#0a1030;border-radius:18px 18px 0 0;overflow:hidden;box-shadow:0 18px 44px rgba(10,16,48,.3)}
.player-wrap>div,.player-wrap>iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.watch{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin:0 0 18px;min-height:56px}
.player-wrap+.watch{border-radius:0 0 18px 18px;border-top:0;box-shadow:0 18px 30px rgba(10,16,48,.08)}
.watch .bar-progress{flex:1;min-width:140px}
.lesson-nav{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:24px}
.res{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.res a{display:flex;gap:10px;align-items:center;padding:11px 15px;border:1px solid var(--line);border-radius:12px;text-decoration:none;background:#fff}
.res a:hover{border-color:var(--primary)}

/* ---------- quiz ---------- */
.q{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:20px 22px;margin:0 0 14px;min-inline-size:0}
.q legend{padding:0;float:left;width:100%;font-weight:600;font-size:1.06rem;line-height:1.55;margin-bottom:14px;display:flex;gap:12px}
.q legend+*{clear:both}
.q .qn{flex:none;min-width:32px;height:32px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--head);font-size:.9rem}
.q .hint{display:block;font-weight:400;color:var(--ink-3);font-size:.86rem}
.q img.qimg{display:block;max-height:280px;border-radius:12px;margin:0 0 14px;border:1px solid var(--line)}
.choice{position:relative;display:flex;gap:14px;align-items:flex-start;padding:11px 16px 11px 12px;border:1.5px solid var(--line-2);border-radius:14px;margin-bottom:9px;cursor:pointer;min-height:56px;background:#fff;line-height:1.5;transition:border-color .12s,background .12s}
.choice:hover{border-color:var(--primary)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice .bx{flex:none;width:34px;height:34px;border:2px solid var(--line-2);border-radius:50%;display:grid;place-items:center;background:#fff;font-family:var(--head);font-weight:600;font-size:.95rem;color:var(--ink-2);transition:all .12s}
.choice.multi .bx{border-radius:10px}
.choice .tx{flex:1;min-width:0;padding-top:4px}
.choice input:checked~.bx{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.choice:has(input:checked){border-color:var(--primary);background:var(--primary-50)}
.choice input:focus-visible~.bx{outline:3px solid var(--accent);outline-offset:2px}
.qbar{position:sticky;bottom:10px;z-index:5;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:16px;padding:12px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 10px 36px rgba(15,26,69,.16);margin-top:8px}
.qprog{flex:1;min-width:180px}
.qprog .bar-progress{margin-top:6px;height:6px}
.result{display:flex;gap:24px;align-items:center;flex-wrap:wrap;padding:22px 24px;border-radius:var(--r);background:#fff;border:1px solid var(--line);margin-bottom:16px}
.result.pass{background:var(--ok-bg);border-color:#bfe5d3}
.result.fail{background:var(--bad-bg);border-color:#efc3c3}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .trk{fill:none;stroke:var(--primary-100);stroke-width:9}
.ring .val{fill:none;stroke:var(--primary);stroke-width:9;stroke-linecap:round;stroke-dasharray:100;animation:ring .9s .1s ease-out both}
.pass .ring .trk{stroke:#c9e6d8}.pass .ring .val{stroke:var(--ok)}
.fail .ring .trk{stroke:#f0d2d2}.fail .ring .val{stroke:var(--bad)}
.ring b{position:absolute;top:0;left:0;right:0;bottom:0;display:grid;place-items:center;font-family:var(--head);font-size:1.45rem}
@keyframes ring{from{stroke-dashoffset:100}}
.review .choice{cursor:default}
.review .choice:hover{border-color:var(--line-2)}
.choice.is-correct{border-color:var(--ok);background:var(--ok-bg)}
.choice.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.is-correct .bx{border-color:var(--ok);color:var(--ok)}
.is-wrong .bx{border-color:var(--bad);color:var(--bad)}
.choice .flag{margin-left:auto;font-size:.82rem;font-weight:600;white-space:nowrap;padding-top:6px}
.is-correct .flag{color:var(--ok)}.is-wrong .flag{color:var(--bad)}
.why{margin-top:10px;padding:11px 15px;border-radius:12px;background:var(--primary-50);font-size:.95rem;color:var(--ink-2)}
.q.ok{border-color:#bfe5d3}.q.no{border-color:#efc3c3}

/* ---------- certificate ---------- */
.cert-box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--lift)}
.cert-box canvas{display:block;width:100%;height:auto;border-radius:6px}
.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.compare>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:center}
.compare b{display:block;font-family:var(--head);font-size:1.8rem;line-height:1.3}
.compare span{color:var(--ink-2);font-size:.9rem}

/* ---------- my learning ---------- */
.hero.slim{padding:34px 0 40px}
.hero.slim h1{margin-bottom:.2em}

/* ---------- admin ---------- */
.admin-bar{background:var(--deep-2);color:#fff}
.admin-bar .wrap{display:flex;gap:14px;align-items:center;min-height:50px;flex-wrap:wrap}
.admin-bar a{color:#dbe3ff;text-decoration:none;padding:6px 10px;border-radius:999px;font-size:.95rem}
.admin-bar a:hover,.admin-bar a.on{background:rgba(255,255,255,.15);color:#fff}
.admin-bar b{font-family:var(--head);font-weight:600;color:var(--accent)}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-radius:14px;background:var(--warn-bg);border:1px solid #f2d9a0;margin-bottom:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:20px 0 22px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 18px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-1px;min-height:48px}
.tab:hover{color:var(--primary)}
.tab.on{color:var(--primary);border-bottom-color:var(--accent)}
details.item{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px}
details.item>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:center;min-height:58px;border-radius:14px}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary::after{content:"";margin-left:auto;width:9px;height:9px;border:solid var(--ink-3);border-width:0 2px 2px 0;transform:rotate(45deg);flex:none;transition:transform .15s}
details.item[open]>summary::after{transform:rotate(-135deg)}
details.item[open]>summary{border-bottom:1px solid var(--line);border-radius:14px 14px 0 0;background:#fafbfe}
details.item>summary:hover{background:#fafbfe}
.item-b{padding:18px 18px 6px}
.item .sn{flex:none;min-width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--head);font-size:.9rem;font-weight:600}
.item .st{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.item .thumb{width:64px;height:36px;border-radius:7px;object-fit:cover;background:#e8ebf3;flex:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 14px}
.sub{border-left:3px solid var(--accent);padding-left:18px;margin:8px 0 16px}
.choice-row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.choice-row input.ans{width:22px;height:22px;accent-color:var(--ok);flex:none}
.choice-row input[type=text]{flex:1}
.choice-row .fixed{flex:1;padding:10px 14px;background:#f3f5fa;border-radius:11px}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th,.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-family:var(--head);font-weight:600;color:var(--ink-2);font-size:.88rem;background:#fafbfe}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}

pre.code{background:#0f1830;color:#dbe3ff;padding:14px 16px;border-radius:12px;overflow:auto;font-size:.82rem;line-height:1.5;white-space:pre}
.kbd{font-family:ui-monospace,Menlo,monospace;background:#eef1f8;padding:1px 7px;border-radius:6px;font-size:.88em}

/* ---------- modal / toast ---------- */
.backdrop{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:rgba(10,16,48,.58);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .18s both}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:pop .2s cubic-bezier(.2,.8,.3,1) both}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 4px 24px}
.modal-h h3{margin:0;font-size:1.2rem}
.modal-b{padding:8px 24px 6px;overflow:auto;flex:1}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 24px 22px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.toasts{position:fixed;left:0;right:0;bottom:20px;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:#fff;padding:12px 22px;border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.28);max-width:520px;font-size:.98rem;transition:opacity .3s,transform .3s}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}
.toast.out{opacity:0;transform:translateY(8px)}
.plist{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:8px}
.plist .p{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px}
.plist .p.cur{border-color:var(--primary);background:var(--primary-50)}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .hero-grid,.dgrid,.learn{grid-template-columns:minmax(0,1fr)}
  .side-card,.outline{position:static;max-height:none}
  .dgrid .side-card{order:-1}
  .side-card .cover{aspect-ratio:21/8}
  .dgrid{margin-top:-70px;gap:20px}
  .dhead{padding-bottom:96px}
  .hero{padding:40px 0 48px}
  .hero-grid{gap:32px}
}
@media (max-width:640px){
  body{font-size:16.5px}
  .wrap{padding:0 15px}
  .bar{gap:8px;min-height:60px}
  .nav{margin-left:0}
  .nav a{padding:8px 10px;font-size:.95rem}
  .s-full{display:none}.s-short{display:inline}
  .brand .name{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .compare{grid-template-columns:1fr}
  .panel{padding:18px}
  .q{padding:16px}
  .user-chip span.n{display:none}
  .user-chip{padding:4px}
  .modal{max-height:calc(100vh - 20px)}
  .backdrop{align-items:flex-end;padding:10px}
  .btn.lg{width:100%}
  .how{padding:22px 20px 6px}
  .hero-stats{gap:6px 18px}
  .qbar{bottom:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.topbar,.footer,.admin-bar,.no-print{display:none!important}body{background:#fff}}

/* ---------- accounts, users, roles ---------- */
.auth{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);max-width:980px;padding:0;margin:40px auto 0;border-radius:24px;overflow:hidden;box-shadow:var(--lift);border:1px solid var(--line);background:#fff}
.auth-side{position:relative;background:var(--deep) radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.7px) 0 0/24px 24px;color:#fff;padding:40px 36px}
.auth-side h1{color:#fff;font-size:2rem;margin-bottom:.35em}
.auth-side p{color:rgba(255,255,255,.8)}
.roles{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:18px}
.roles li{display:flex;gap:14px;align-items:flex-start}
.roles .nd{position:static;flex:none;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}
.roles b{display:block;font-family:var(--head);font-weight:600}
.roles .small{color:rgba(255,255,255,.72);line-height:1.5}
.auth-form{border:0;border-radius:0;padding:40px 36px;margin:0}
.auth-form h2{margin-bottom:18px}
.passwrap{display:flex;gap:8px;align-items:center}
.passwrap input{flex:1;min-width:0}
.auth-or{display:flex;align-items:center;gap:12px;color:var(--ink-3);margin:18px 0;font-size:.9rem}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;text-decoration:none;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.stat:hover{border-color:var(--primary);box-shadow:0 8px 24px rgba(15,26,69,.08);color:var(--ink)}
.stat b{font-family:var(--head);font-size:2rem;line-height:1.2;font-weight:600}
.stat span{color:var(--ink-2);font-size:.9rem}
.admin-bar .count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:#2b2000;font-size:.75rem;font-weight:700;margin-left:7px;vertical-align:1px}
.cover .lockt{position:absolute;left:12px;bottom:12px;z-index:3}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select{width:auto;min-width:150px}
.search-s{position:relative;flex:1 1 240px}
.search-s .ic{position:absolute;left:13px;top:50%;margin-top:-9px;color:var(--ink-3)}
.search-s input{padding-left:42px}
.nowrap{white-space:nowrap}
@media (max-width:820px){
  .auth{grid-template-columns:minmax(0,1fr);margin-top:20px;border-radius:20px}

  .roles{margin-top:20px}
}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar select{flex:1 1 140px}}

@media (max-width:900px){.user-chip span.n{display:none}.user-chip{padding:4px}}

/* ---------- analytics / charts ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;min-width:0}
.kpi .kl{color:var(--ink-2);font-size:.88rem;line-height:1.35}
.kpi b{font-family:var(--head);font-size:1.9rem;line-height:1.25;font-weight:600;margin-top:2px}
.kpi small{color:var(--ink-3);font-size:.8rem;line-height:1.35}
.grid-ch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px;align-items:start}
.grid-ch .panel,.grid-ch .panel+.panel{margin-top:0}
.panel.chart{margin-top:0}
.panel.chart+.panel{margin-top:16px}
.grid-ch .panel.chart+.panel.chart{margin-top:0}
.callout.mt-s{margin-top:14px}
@media (max-width:640px){.callout{flex-wrap:wrap}.callout .grow{flex:1 1 calc(100% - 40px);min-width:0}.callout>.btn{margin-left:30px}}
.chart-h{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}

.filters .srch{position:relative;flex-direction:row;align-items:center}
.filters .srch .ic{position:absolute;left:12px;color:var(--ink-3)}
.filters .srch input{padding-left:38px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;color:var(--ink-2);margin:0 0 10px}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .sw.ln{width:16px;height:3px;border-radius:2px;vertical-align:3px}
.vbars{display:grid;gap:12px}
.vb{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr) 3.4em;gap:12px;align-items:center;border-radius:8px;outline-offset:3px}
.vb-l{min-width:0;font-size:.94rem;line-height:1.35;overflow-wrap:anywhere}
.vb-l a{color:var(--ink);text-decoration:none;font-weight:600}
.vb-l a:hover{color:var(--primary);text-decoration:underline}
.vb-l small{display:block;color:var(--ink-3);font-size:.8rem}
.vb-t{height:14px;background:#eef1f8;border-radius:0 4px 4px 0;position:relative}

.vb-v{font-family:var(--head);font-weight:600;font-size:.95rem;text-align:right}
.vb:hover .vb-t i,.vb:focus-visible .vb-t i,.fn:hover .vb-t i,.fn:focus-visible .vb-t i{filter:brightness(1.12)}
.dbs{position:relative;display:grid;gap:12px}
.db-axis{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr) 3.4em;gap:12px;font-size:.76rem;color:var(--ink-3)}
.db-axis .ticks{display:flex;justify-content:space-between}
.db{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr) 3.4em;gap:12px;align-items:center;border-radius:8px;outline-offset:3px}
.db-t{position:relative;height:22px;background:linear-gradient(to right,var(--line) 1px,transparent 1px) 0 0/25% 100%;border-right:1px solid var(--line)}
.db-t::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.db-t u{position:absolute;top:50%;height:3px;margin-top:-1.5px;background:#9ec5f4;text-decoration:none;border-radius:2px}
.db-t i{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.db-t i.a{background:#86b6ef}.db-t i.b{background:#1c5cab}
.hist{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;height:190px;align-items:end;border-bottom:1px solid var(--line);padding-top:4px}

.hc .hx{position:absolute;bottom:-1.7em;font-size:.76rem;color:var(--ink-3)}
.hist{margin-bottom:2em}
.hc:hover i,.hc:focus-visible i{filter:brightness(1.15)}
.viz-line{width:100%;min-height:232px}
.viz-line svg{display:block;max-width:100%;height:auto;font-family:var(--body)}

.mix{display:flex;gap:2px;height:10px;margin:2px 0 12px}

.funnel{display:grid;gap:12px}

.fn .vb-t{height:20px}
.fn .fd{font-size:.8rem;color:var(--ink-3);text-align:right}
.meter{height:8px;background:#eef1f8;border-radius:99px;overflow:hidden;min-width:70px;flex:1}

.cellbar{display:flex;align-items:center;gap:10px;min-width:150px}
.cellbar span{font-size:.88rem;white-space:nowrap;color:var(--ink-2)}
details.tv{margin-top:12px}
details.tv summary{cursor:pointer;font-size:.88rem;color:var(--primary);font-weight:600}
details.tv .tbl-wrap{margin-top:8px;max-height:260px;overflow:auto}
.viz-tip{position:fixed;z-index:400;pointer-events:none;background:var(--deep);color:#fff;border-radius:10px;padding:8px 12px;font-size:.88rem;line-height:1.5;max-width:300px;white-space:pre-line;box-shadow:0 10px 30px rgba(15,26,69,.3)}
.viz-tip::first-line{font-weight:700;font-size:1rem}
.mb-s{margin-bottom:6px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-ch{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:1.6rem}
  .vb,.db{grid-template-columns:minmax(0,1fr) 3.2em;row-gap:5px}.vb .vb-l,.db .vb-l{grid-column:1/-1}

// "ผู้ดูแลระบบ+ครูผู้สอน" / "ครู, นักเรียน" / "admin/teacher" → { role: highest hat, also: [...] }, or null when a word is not understood
function parseRoles(v) {
  const parts = String(v == null ? '' : v).split(/\s*(?:\+|,|&|\/|;|、|และ)\s*/).filter(x => x.trim() !== '');
  if (!parts.length) return { role: 'student', also: [] };
  const rs = parts.map(parseRole1); if (rs.some(r => r === null)) return null;
  return normHats(rs[0], rs.slice(1));
}
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
// rows (array of arrays incl. header) → { items:[{line,user,errors:[],skipped}], missing:[...columns] }
function parseUserRows(rows) {
  let hi = rows.findIndex((r, i) => i < 8 && 'email' in mapHeader(r)); if (hi < 0) hi = -1;
  if (hi < 0) return { items: [], missing: ['อีเมล'] };
  const map = mapHeader(rows[hi]), missing = [];
  if (!('name' in map)) missing.push('ชื่อ-นามสกุล');
  const cell = (r, f) => (f in map && r[map[f]] != null ? String(r[map[f]]).trim() : '');
  const items = [], seen = new Set();
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i]; if (!r || r.every(x => String(x == null ? '' : x).trim() === '')) continue;
    const pr = parseRoles(cell(r, 'role'));
    const u = { email: normEmail(cell(r, 'email')), password: cell(r, 'password'), name: cell(r, 'name').replace(/\s+/g, ' '), role: pr ? pr.role : null, also: pr ? pr.also : [], sid: cell(r, 'sid'), group: cell(r, 'group'), org: cell(r, 'org') };
    const it = { line: i + 1, user: u, errors: [], skipped: false, gen: false };
    if (/@example\.com$/.test(u.email)) { it.skipped = true; items.push(it); continue; }
    if (!u.email) it.errors.push('ไม่มีอีเมล'); else if (!EMAIL_RE.test(u.email)) it.errors.push('รูปแบบอีเมลไม่ถูกต้อง');
    else if (seen.has(u.email)) it.errors.push('อีเมลซ้ำในไฟล์'); else seen.add(u.email);
    if (u.name.length < 2) it.errors.push('ไม่มีชื่อ-นามสกุล');
    if (u.role === null) { it.errors.push('บทบาทไม่ถูกต้อง (ใช้ นักเรียน / ครูผู้สอน / ผู้ดูแลระบบ หรือรวมกันด้วย + เช่น ผู้ดูแลระบบ+ครูผู้สอน)'); u.role = 'student'; }
    if (!u.password) { if (u.sid) u.password = u.sid; else it.gen = true; }
    if (u.password && u.password.length < 4) it.errors.push('รหัสผ่านสั้นเกินไป (อย่างน้อย 4 ตัวอักษร)');
    items.push(it);
  }
  return { items, missing };
}

function merge(def, obj) {
  if (Array.isArray(def) || def === null || typeof def !== 'object') return obj === undefined ? def : obj;
  const out = {};
  const src = obj && typeof obj === 'object' && !Array.isArray(obj) ? obj : {};
  for (const k of Object.keys(def)) out[k] = merge(def[k], src[k]);
  for (const k of Object.keys(src)) if (!(k in out)) out[k] = src[k];
  return out;
}
function normQuestion(q) {
  q = merge(newQuestion(q && q.type), q || {});
  if (!Array.isArray(q.choices)) q.choices = [];
  if (q.type === 'tf') q.choices = ['จริง', 'เท็จ'];
  q.answer = (Array.isArray(q.answer) ? q.answer : [q.answer]).map(Number).filter(i => Number.isInteger(i) && i >= 0 && i < q.choices.length);
  if (!q.answer.length) q.answer = [0];
  return q;
}
function normCourse(c) {
  c = merge(newCourse(), c);
  c.lessons = (c.lessons || []).map(l => {
    l = merge(newLesson(), l); l.quiz.questions = l.quiz.questions.map(normQuestion);
    l.images = (Array.isArray(l.images) ? l.images : []).map(g => ({ src: String((g && g.src) || ''), cap: String((g && g.cap) || '') })).filter(g => g.src);
    return l;
  });
  c.preTest.questions = c.preTest.questions.map(normQuestion);
  c.postTest.questions = c.postTest.questions.map(normQuestion);
  const s = c.certificate.signers || []; while (s.length < 2) s.push({ name: '', title: '', image: '' });
  c.certificate.signers = s.slice(0, 2).map(x => merge({ name: '', title: '', image: '' }, x));
  if (c.certificate.design) c.certificate.design = normDesign(c.certificate.design);
  return c;
}
function normData(d) {
  d = d && typeof d === 'object' ? d : {};
  d.schema = 1;
  d.settings = merge(DEF_SETTINGS, d.settings || {});
  d.courses = (d.courses || []).map(normCourse);
  d.announcements = (Array.isArray(d.announcements) ? d.announcements : []).filter(a => a && typeof a === 'object').map(a => merge(newAnn(), a));
  // certificate designs saved for re-use (administrator): { id, name, at, colors: {p, g}, design }
  d.certLib = (Array.isArray(d.certLib) ? d.certLib : []).filter(x => x && typeof x === 'object' && x.design).map(x => ({ id: String(x.id || uid('lb-')), name: String(x.name || 'แบบเกียรติบัตร').slice(0, 80), at: num(x.at, 0), colors: { p: String((x.colors && x.colors.p) || '#26418f'), g: String((x.colors && x.colors.g) || '#b88a2e') }, design: normDesign(x.design) }));
  d.updatedAt = d.updatedAt || 0;
  d.auth = merge({ setup: false, salt: '', accounts: [] }, d.auth || {});
  if (!Array.isArray(d.auth.accounts)) d.auth.accounts = [];
  if (d.users !== undefined && !Array.isArray(d.users)) delete d.users;
  if (d.inbox !== undefined && !Array.isArray(d.inbox)) delete d.inbox;
  return d;
}

/* ---------- load / save ---------- */
let EMBEDDED = normData(JSON.parse($('#pmooc-data').textContent));

const BAKED = { url: String(EMBEDDED.settings.webhookUrl || '').trim(), salt: EMBEDDED.auth.salt || '', at: EMBEDDED.updatedAt || 0, live: !!EMBEDDED.settings.dbPublish };   // what the HTML file itself carries
const remoteCacheFits = r => !!(r && r.data && r.url === BAKED.url && (r.salt || '') === BAKED.salt && (r.data.updatedAt || 0) > BAKED.at);
(function useCachedRemote() {

  if (!r) return;
  if (remoteCacheFits(r)) { try { EMBEDDED = normData(r.data); } catch (e) { store.del(LS.remote); } } else store.del(LS.remote);
})();
let DATA;
const HASH = {};   // course id → fingerprint at last save (so we can stamp updatedAt only on courses that really changed)
const courseHash = c => fnv(JSON.stringify(Object.assign({}, c, { updatedAt: 0, sentRev: 0 })));
const rebaseHashes = () => { DATA.courses.forEach(c => { HASH[c.id] = courseHash(c); }); };
function loadData() {
  const local = store.get(LS.data, null), ld = local && local.data;
  if (ld && (ld.updatedAt || 0) > (EMBEDDED.updatedAt || 0)) DATA = normData(ld);
  else {
    DATA = deep(EMBEDDED);
    // the published file has caught up with this browser's edits: keep the administrator-only data (roster, fingerprints, inbox) — it never travels in index.html

    if (adminData) { if (typeof SESS !== 'undefined' && SESS && SESS.role === 'admin') { ['users', 'fp', 'inbox'].forEach(k => { if (ld[k] !== undefined) DATA[k] = deep(ld[k]); }); store.set(LS.data, { data: DATA }); } }
    else if (local) store.del(LS.data);

}
const isDirty = () => (DATA.updatedAt || 0) > (EMBEDDED.updatedAt || 0);
let saveTimer = null;
function touchChanged() {

}

const getCourse = id => DATA.courses.find(c => c.id === id);

/* ---------- profiles & progress ---------- */
let PROFILES = store.get(LS.profiles, []);
let CUR = store.get(LS.cur, null);

// a signed-in account always wins; otherwise the guest profile picked on this device
const profile = () => (SESS ? PROFILES.find(p => p.id === 'a:' + SESS.id) || null : PROFILES.find(p => p.id === CUR && !p.account) || null);
const saveProfiles = () => { store.set(LS.profiles, PROFILES); store.set(LS.cur, CUR); };

function addProfile(d) {

  PROFILES.push(p); CUR = p.id; saveProfiles(); return p;
}
const newCP = () => ({ startedAt: Date.now(), pre: null, lessons: {}, post: { attempts: [], best: 0, passed: false }, qs: {}, completedAt: null, certId: null });
function cp(courseId, create) {
  const p = profile(); if (!p) return null;
  let all = PROG[p.id]; if (!all) { if (!create) return null; all = PROG[p.id] = {}; }
  if (!all[courseId]) { if (!create) return null; all[courseId] = newCP(); saveProg(); emit('enroll', { course: cinfo(getCourse(courseId)) }); }
  return all[courseId];
}
function lp(cpv, lesson) {
  if (!cpv.lessons[lesson.id]) cpv.lessons[lesson.id] = { watched: 0, duration: 0, pos: 0, videoDone: false, quiz: { attempts: 0, best: 0, passed: false } };

/* ---------- derived status ---------- */
const hasQuiz = l => !!(l.quiz && l.quiz.enabled && l.quiz.questions.length);
const preOn = c => !!(c.preTest.enabled && c.preTest.questions.length);
const postOn = c => !!(c.postTest.enabled && c.postTest.questions.length);
function lessonDone(c, cpv, l) {
  const p = cpv && cpv.lessons[l.id]; if (!p || !p.videoDone) return false;
  return !hasQuiz(l) || !!(p.quiz && p.quiz.passed);
}
function status(c, cpv) {
  const doneLessons = c.lessons.filter(l => lessonDone(c, cpv, l)).length;
  const pre = preOn(c), post = postOn(c);
  const preDone = !!(cpv && cpv.pre), postPassed = !!(cpv && cpv.post && cpv.post.passed);
  const reqPre = pre && !!c.preTest.required;
  const total = c.lessons.length + (pre ? 1 : 0) + (post ? 1 : 0);
  const done = doneLessons + (pre && preDone ? 1 : 0) + (post && postPassed ? 1 : 0);
  const allLessons = doneLessons === c.lessons.length;
  const complete = !!cpv && allLessons && (!post || postPassed) && (!reqPre || preDone);
  return { doneLessons, pre, post, preDone, postPassed, reqPre, total, done, percent: pct(done, total), allLessons, complete };
}
function canOpen(c, cpv, step) {
  const st = status(c, cpv);
  if (step.type === 'pre') return true;
  if (step.type === 'lesson') {
    if (st.reqPre && !st.preDone) return false;
    if (!c.sequential || step.index === 0) return true;
    return lessonDone(c, cpv, c.lessons[step.index - 1]);
  }
  if (step.type === 'post') return !(st.reqPre && !st.preDone) && st.allLessons;
  if (step.type === 'cert') return st.complete && !!c.certificate.enabled;
  return false;
}
function stepsOf(c) {
  const s = [];
  if (preOn(c)) s.push({ type: 'pre', key: 'pre' });
  c.lessons.forEach((l, i) => s.push({ type: 'lesson', lesson: l, index: i, key: 'l:' + l.id }));
  if (postOn(c)) s.push({ type: 'post', key: 'post' });
  if (c.certificate.enabled) s.push({ type: 'cert', key: 'cert' });
  return s;
}
function stepDone(c, cpv, s) {
  const st = status(c, cpv);
  if (s.type === 'pre') return st.preDone;
  if (s.type === 'lesson') return lessonDone(c, cpv, s.lesson);
  if (s.type === 'post') return st.postPassed;
  if (s.type === 'cert') return st.complete;
  return false;
}
function stepHref(c, s) {
  const b = '#/learn/' + c.id + '/';
  return s.type === 'lesson' ? b + 'lesson/' + s.lesson.id : b + s.type;
}
function nextStep(c, cpv) {
  for (const s of stepsOf(c)) if (!stepDone(c, cpv, s) && canOpen(c, cpv, s)) return s;
  return null;
}
function refreshCompletion(c, cpv) {
  const st = status(c, cpv);
  if (st.complete && !cpv.completedAt) {
    cpv.completedAt = Date.now();
    const d = new Date(cpv.completedAt);
    cpv.certId = `${c.certificate.idPrefix || 'PM'}-${String(d.getFullYear()).slice(-2)}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${Math.random().toString(36).slice(2, 7).toUpperCase()}`;
    saveProg();
    emit('complete', { course: cinfo(c), pre: cpv.pre ? cpv.pre.percent : null, post: cpv.post.best, certId: cpv.certId });
    if (c.certificate.enabled) ensureSerial(c, cpv);   // ask the database for the certificate number in the background
    return true;
  }
  return false;
}
const durationText = c => c.duration || '';

/* ---------- results hook (Google Apps Script / any webhook) ---------- */
const cinfo = c => c ? { id: c.id, title: c.title, owner: c.owner || '' } : null;
function emit(event, extra) {
  const url = DATA.settings.webhookUrl; if (!url) return;
  const p = profile();
  const payload = Object.assign({ event, at: new Date().toISOString(), site: DATA.settings.siteName, learner: p ? { id: p.id, name: p.name, email: p.email, extra: p.extra, group: p.group || '', sid: p.sid || '', role: p.role || (p.account ? '' : 'guest') } : null }, extra || {});
  sendHook(url, payload);
}
function sendHook(url, payload) {

    fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), keepalive: true })
      .catch(() => queueHook(payload));

}
function queueHook(payload) { const q = store.get(LS.queue, []); q.push(payload); store.set(LS.queue, q.slice(-200)); }
function flushQueue() {

/* =====================================================================
   Accounts, sessions, permissions, roster (users) and teacher drafts

   How it fits a static site (no server):
   • The roster (e-mail, name, password, group …) is kept in plain form ONLY in the administrator's browser (DATA.users).
   • What is embedded in index.html is DATA.auth.accounts: each account = hash(e-mail) + a box encrypted with the password,
     so the public file shows no names or e-mails, and a login is "can this password open the box?".
   • Teachers work on their own courses in their own browser, then send a course file to the administrator for approval.
   ===================================================================== */
let SESS = null;
let LOGIN_NEXT = '';
const ROLE_TH = { admin: 'ผู้ดูแลระบบ', teacher: 'ครูผู้สอน', student: 'นักเรียน' };
const SESSION_DAYS = 7;

function loadSession() {
  const s = store.get(LS.sess, null);
  if (s && s.id && s.role && ROLE_TH[s.role] && Date.now() - (s.at || 0) < SESSION_DAYS * 864e5) SESS = s;
  else { SESS = null; if (s) store.del(LS.sess); }
}
function isAdmin() { return !!SESS && SESS.role === 'admin'; }
function isTeacher() { return !!SESS && SESS.role === 'teacher'; }
function isStaff() { return isAdmin() || isTeacher(); }
// One account may wear several hats: `role` is the main (highest) one, `also` lists the others (e.g. admin + teacher, teacher + student).
// An administrator can already do everything a teacher can; the "teacher" hat on an admin marks them as a course author
// (listed as an instructor, can own courses, counted in teacher statistics). The "student" hat makes their own learning count like a student's.
const sessHas = r => !!SESS && (SESS.role === r || (Array.isArray(SESS.also) && SESS.also.indexOf(r) >= 0));
const isInstructor = () => sessHas('teacher');
const splitList = s => String(s || '').split(/[,;\n、]+/).map(x => x.trim().toLowerCase()).filter(Boolean);
// published files carry a course owner as 'h:<account id>' (a hash), never as an e-mail address
function ownsCourse(c) { return !!SESS && !!c.owner && (normEmail(c.owner) === normEmail(SESS.email) || c.owner === 'h:' + SESS.id); }
const ownerIs = (c, email) => !!c.owner && !!email && (normEmail(c.owner) === normEmail(email) || (!!DATA.auth.salt && c.owner === 'h:' + acctIdOf(normEmail(email), DATA.auth.salt)));
function resolveOwners(D) {
  if (!Array.isArray(D.users) || !D.auth.salt) return;
  const m = {}; D.users.forEach(u => { m['h:' + acctIdOf(u.email, D.auth.salt)] = u.email; });
  D.courses.forEach(c => { if (c.owner && m[c.owner]) c.owner = m[c.owner]; });
}
function canEditCourse(c) { return isAdmin() || (isTeacher() && ownsCourse(c)); }
function canViewCourse(c) { return !!c.published || canEditCourse(c); }

/* ---------- who may study a course ---------- */
function courseAccess(c) {
  const a = c.access || { mode: 'public' };
  if (canEditCourse(c)) return { ok: true };
  if (a.mode === 'members') return SESS ? { ok: true } : { ok: false, why: 'login', msg: 'คอร์สนี้สำหรับผู้ที่มีบัญชีในระบบ กรุณาเข้าสู่ระบบก่อน' };
  if (a.mode === 'groups') {
    const want = splitList(a.groups);
    if (!SESS) return { ok: false, why: 'login', msg: `คอร์สนี้เปิดเฉพาะกลุ่ม ${a.groups || '(ที่กำหนด)'} กรุณาเข้าสู่ระบบก่อน` };
    if (!want.length) return { ok: true };
    const have = splitList(SESS.group);
    return want.some(g => have.includes(g)) ? { ok: true } : { ok: false, why: 'group', msg: `คอร์สนี้เปิดเฉพาะกลุ่ม ${a.groups} (บัญชีของคุณอยู่กลุ่ม: ${SESS.group || 'ไม่ได้ระบุ'}) หากคิดว่าผิดพลาด โปรดแจ้งผู้ดูแลระบบ` };
  }

/* ---------- roster (administrator's browser only) ---------- */
const hasRoster = () => Array.isArray(DATA.users);
function ensureRoster() { if (!Array.isArray(DATA.users)) DATA.users = []; if (!DATA.fp || typeof DATA.fp !== 'object') DATA.fp = {}; }
const ROLES = ['student', 'teacher', 'admin'];
const ROLE_RANK = { student: 0, teacher: 1, admin: 2 };
function normHats(role, also) {   // → { role: highest hat, also: the other hats, highest first }
  const set = new Set([ROLES.includes(role) ? role : 'student']);
  (Array.isArray(also) ? also : String(also || '').split(',')).forEach(r => { r = String(r).trim(); if (ROLES.includes(r)) set.add(r); });
  const all = Array.from(set).sort((a, b) => ROLE_RANK[b] - ROLE_RANK[a]);
  return { role: all[0], also: all.slice(1) };
}
const hasRole = (u, r) => !!u && (u.role === r || (Array.isArray(u.also) && u.also.indexOf(r) >= 0));
const hatsOf = u => [u.role].concat(Array.isArray(u.also) ? u.also : []);
const rolesText = (u, sep) => hatsOf(u).map(r => ROLE_TH[r] || r).join(sep || ' + ');
function normUser(u) {
  const h = normHats(u.role, u.also);
  return { email: normEmail(u.email), name: String(u.name || '').trim().replace(/\s+/g, ' '), role: h.role, also: h.also, password: String(u.password || '').trim(), sid: String(u.sid || '').trim(), group: String(u.group || '').trim(), org: String(u.org || '').trim() };
}
function genPassword() { const abc = 'abcdefghjkmnpqrstuvwxyz23456789', r = randBytes(6); let s = ''; for (let i = 0; i < 6; i++) s += abc[r[i] % abc.length]; return s; }
const userFp = u => fnv([u.email, u.password, u.name, u.role, u.sid, u.group, u.org].join('\u0001') + (u.also && u.also.length ? '\u0001' + u.also.join(',') : ''));
const findUser = email => (DATA.users || []).find(u => u.email === normEmail(email)) || null;
function upsertUser(u) {
  ensureRoster(); u = normUser(u);
  const i = DATA.users.findIndex(x => x.email === u.email);
  if (i >= 0) DATA.users[i] = Object.assign({}, DATA.users[i], u); else DATA.users.push(Object.assign({ createdAt: Date.now() }, u));
  if (SESS && u.email === normEmail(SESS.email)) { SESS.also = u.also.slice(); store.set(LS.sess, SESS); }   // the admin editing their own account sees new hats at once
  return u;
}
function removeUser(email) { ensureRoster(); DATA.users = DATA.users.filter(u => u.email !== normEmail(email)); }
const tick = () => new Promise(r => setTimeout(r, 0));
async function syncAccounts(progress) {   // roster → encrypted accounts (only rows that changed are re-encrypted)
  ensureRoster(); const A = DATA.auth; if (!A.salt) A.salt = toHex(randBytes(16));
  const byId = {}; A.accounts.forEach(a => { byId[a.i] = a; });
  const keep = new Set(); let n = 0, todo = 0;
  DATA.users.forEach(u => { const id = acctIdOf(u.email, A.salt); if (!byId[id] || DATA.fp[id] !== userFp(u)) todo++; });
  for (const u of DATA.users) {
    const id = acctIdOf(u.email, A.salt), fp = userFp(u); keep.add(id);
    if (!byId[id] || DATA.fp[id] !== fp) {
      byId[id] = sealAccount(Object.assign({ v: 1, e: u.email, n: u.name, r: u.role, g: u.group, o: u.org, s: u.sid }, u.also && u.also.length ? { x: u.also.join(',') } : {}), u.password, id, KDF_ITER);
      DATA.fp[id] = fp; n++;
      if (progress) progress(n, todo);
      if (n % 3 === 0) await tick();
    }
  }
  Object.keys(DATA.fp).forEach(id => { if (!keep.has(id)) { delete byId[id]; delete DATA.fp[id]; } });
  A.accounts = Object.keys(byId).map(k => byId[k]);
  if (typeof dbQueuePush === 'function') dbQueuePush();
}
const countByRole = () => { const o = { admin: 0, teacher: 0, student: 0 }; (DATA.users || []).forEach(u => { o[u.role] = (o[u.role] || 0) + 1; }); return o; };
const instructorUsers = () => (DATA.users || []).filter(u => hasRole(u, 'teacher'));   // teachers + admins who also teach

function upsertAccountProfile() {
  const id = 'a:' + SESS.id, p = PROFILES.find(x => x.id === id);
  const d = { id, account: true, name: SESS.name, email: SESS.email, extra: SESS.org, group: SESS.group, sid: SESS.sid, role: SESS.role, also: (SESS.also || []).slice() };
  if (p) Object.assign(p, d); else PROFILES.push(Object.assign({ createdAt: Date.now(), certName: '' }, d));
  saveProfiles();
}
function reloadForSession() { loadData(); applyTeacherOverlay(); applyTheme(DATA.settings); if (typeof dbSyncRequests === 'function') setTimeout(() => dbSyncRequests({ silent: true, notify: true }), 900); }
async function login(email, password, retried) {
  email = normEmail(email); password = String(password || '').trim();
  if (!email || !password) return { ok: false, msg: 'กรุณากรอกอีเมลและรหัสผ่าน' };
  await sleep(30);
  const acc = DATA.auth.accounts.find(a => a.i === acctIdOf(email, DATA.auth.salt));
  const prof = acc ? openAccount(acc, password) : (pbkdf2(utf8(password), new Uint8Array(16), KDF_ITER), null);   // same cost whether or not the e-mail exists
  if (!prof || normEmail(prof.e) !== email) {
    // maybe the account was added after this page was last updated: fetch the newest published copy once, then try again
    if (!retried && typeof siteFetch === 'function' && siteLive() && Date.now() - SITE.last > 15000 && (await siteFetch({ noRender: true })) === 'new') return login(email, password, true);
    await sleep(500); return { ok: false, msg: 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' };
  }
  const hats = normHats(prof.r, prof.x);
  SESS = { id: acc.i, email: prof.e, name: prof.n, role: hats.role, also: hats.also, group: prof.g || '', org: prof.o || '', sid: prof.s || '', at: Date.now() };
  store.set(LS.sess, SESS); upsertAccountProfile(); reloadForSession();
  return { ok: true, sess: SESS };
}
function logout() { SESS = null; store.del(LS.sess); loadData(); applyTheme(DATA.settings); }
async function setupFirstAdmin(d) {
  ensureRoster(); DATA.auth.salt = DATA.auth.salt || toHex(randBytes(16));
  upsertUser({ email: d.email, name: d.name, role: 'admin', password: d.password });
  await syncAccounts(); DATA.auth.setup = true; DATA.settings.adminPinHash = '';
  saveData();
}
async function changeMyPassword(oldPw, newPw) {
  const acc = DATA.auth.accounts.find(a => a.i === SESS.id);
  if (!acc || !openAccount(acc, String(oldPw).trim())) return false;
  const u = findUser(SESS.email) || { email: SESS.email, name: SESS.name, role: SESS.role, also: SESS.also || [], sid: SESS.sid, group: SESS.group, org: SESS.org };
  upsertUser(Object.assign({}, u, { password: newPw })); await syncAccounts(); saveData();
  return true;
}

function render(keepScroll) {
  flushSave();
  if (typeof siteApplyPending === 'function') siteApplyPending();   // a newer published copy that arrived while the page was busy
  const y = window.scrollY;
  teardown.forEach(f => { try { f(); } catch (e) { /* ignore */ } }); teardown = [];
  const path = currentPath();
  let out = null;
  for (const [re, fn] of routes) {
    const m = path.match(re);
    if (m) { try { out = fn(...m.slice(1).map(decodeURIComponent)); } catch (e) { console.error(e); out = { html: `<div class="wrap"><div class="empty mt"><div class="big">⚠️</div><p>เกิดข้อผิดพลาด: ${esc(e.message)}</p><a class="btn" href="#/">กลับหน้าแรก</a></div></div>` }; } break; }
  }

  document.title = (out.title ? out.title + ' · ' : '') + DATA.settings.siteName;
  window.scrollTo(0, keepScroll ? y : 0);

}

function stepInfo(c, s) {
  if (s.type === 'pre') return { icon: 'quiz', cls: 'test', t: c.preTest.title || 'แบบทดสอบก่อนเรียน', s: `${c.preTest.questions.length} ข้อ · ${c.preTest.required ? 'ต้องทำก่อนเริ่มเรียน' : 'แนะนำให้ทำก่อนเรียน'}` };
  if (s.type === 'post') return { icon: 'quiz', cls: 'test', t: c.postTest.title || 'แบบทดสอบหลังเรียน', s: `${c.postTest.questions.length} ข้อ · ผ่านเกณฑ์ ${num(c.postTest.passPercent, 60)}%` };
  if (s.type === 'cert') return { icon: 'award', cls: 'cert', t: 'รับเกียรติบัตร', s: 'ปลดล็อกเมื่อเรียนครบทุกขั้นตอน' };
  const l = s.lesson;
  const parts = [ytId(l.youtube) ? 'วิดีโอ' : 'บทอ่าน'];
  if (l.duration) parts.push(l.duration);
  if (hasQuiz(l)) parts.push(`ข้อสอบท้ายบท ${l.quiz.questions.length} ข้อ`);
  return { icon: null, cls: '', t: l.title, s: parts.join(' · '), n: s.index + 1 };
}
function pathHtml(c, cpv, opts = {}) {
  const next = cpv ? nextStep(c, cpv) : null;
  return `<ol class="path">${stepsOf(c).map(s => {
    const inf = stepInfo(c, s), done = cpv && stepDone(c, cpv, s), open = !!cpv && canOpen(c, cpv, s);
    const locked = cpv ? !open : (s.type !== 'pre' && !canOpen(c, null, s));
    const now = next && next.key === s.key;
    const node = done ? icon('check', 18) : locked ? icon('lock', 15) : inf.icon ? icon(inf.icon, 17) : inf.n;
    const body = `<span class="t">${esc(inf.t)}</span><span class="s">${esc(inf.s)}</span>`;
    const cls = done ? 'is-done' : now ? 'is-now' : locked ? 'is-lock' : '';
    return `<li class="${cls}"><span class="nd ${inf.cls}">${node}</span>${open && !opts.static ? `<a class="pi" href="${stepHref(c, s)}" ${s.key === (opts.active || '') ? 'aria-current="page"' : ''}>${body}</a>` : `<div class="pi">${body}</div>`}</li>`;
  }).join('')}</ol>`;
}

async function busy(btn, label, fn) {

}

/* ---------- quiz engine ---------- */
function buildItems(questions, shuffleQ, shuffleC) {
  let items = questions.map(q => ({ q, order: shuffleC && q.type !== 'tf' ? shuffle(q.choices.map((_, i) => i)) : q.choices.map((_, i) => i) }));
  if (shuffleQ) items = shuffle(items);
  return items;
}
const LET = ['ก', 'ข', 'ค', 'ง', 'จ', 'ฉ', 'ช', 'ซ', 'ฌ', 'ญ'];   // Thai choice letters
function ringHtml(p) {
  p = clamp(Math.round(p), 0, 100);
  return `<div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="44"/><circle class="val" cx="50" cy="50" r="44" pathLength="100" style="stroke-dashoffset:${100 - p};${p ? '' : 'opacity:0'}"/></svg><b>${p}%</b></div>`;
}
function qHtml(it, n) {
  const q = it.q, multi = q.type === 'multi';
  return `<fieldset class="q" data-n="${n}"><legend><span class="qn">${n + 1}</span><span>${esc(q.text)}${multi ? '<span class="hint">เลือกได้มากกว่า 1 ข้อ</span>' : ''}</span></legend>
    ${q.image ? imgTag(q.image, { w: 1200, cls: 'qimg' }) : ''}
    ${it.order.map((ci, pos) => `<label class="choice ${multi ? 'multi' : ''}"><input type="${multi ? 'checkbox' : 'radio'}" name="q${n}" value="${ci}"><span class="bx">${LET[pos] || pos + 1}</span><span class="tx">${esc(q.choices[ci])}</span></label>`).join('')}</fieldset>`;
}
const quizFormHtml = items => `<div id="quizform" class="quiz">${items.map(qHtml).join('')}
  <div class="qbar"><div class="qprog"><span class="muted small" id="qcount">ตอบแล้ว 0/${items.length} ข้อ</span><div class="bar-progress"><i id="qfill" style="width:0"></i></div></div><button type="button" class="btn primary" data-action="quiz-submit">ส่งคำตอบ</button></div></div>`;
function updateQCount() {
  const f = $('#quizform'); if (!f) return;
  const n = $$('fieldset.q', f).filter(q => $('input:checked', q)).length;
  const t = $$('fieldset.q', f).length;
  $('#qcount').textContent = `ตอบแล้ว ${n}/${t} ข้อ`; $('#qfill').style.width = pct(n, t) + '%';
}
function readAnswers(items) {
  const f = $('#quizform');
  return items.map((_, n) => $$(`fieldset[data-n="${n}"] input:checked`, f).map(i => Number(i.value)));
}
function grade(items, answers) {
  let earned = 0, total = 0;
  const details = items.map((it, n) => {
    const pts = num(it.q.points, 1) > 0 ? num(it.q.points, 1) : 1, sel = answers[n] || [];
    const ok = sel.length === it.q.answer.length && it.q.answer.every(i => sel.includes(i));
    total += pts; if (ok) earned += pts;
    return { it, sel, ok };
  });
  return { earned, total, percent: pct(earned, total), details, correct: details.filter(d => d.ok).length };
}
function reviewHtml(res) {
  return res.details.map((d, n) => {
    const q = d.it.q, multi = q.type === 'multi';
    return `<div class="q review ${d.ok ? 'ok' : 'no'}"><legend style="display:flex;gap:10px;font-weight:600;margin-bottom:12px"><span class="qn">${n + 1}</span><span>${esc(q.text)} ${d.ok ? '<span class="tag ok">ถูกต้อง</span>' : '<span class="tag warn">ยังไม่ถูกต้อง</span>'}</span></legend>
      ${q.image ? imgTag(q.image, { w: 1200, cls: 'qimg' }) : ''}
      ${d.it.order.map((ci, pos) => {
        const right = q.answer.includes(ci), picked = d.sel.includes(ci);
        const cls = right ? 'is-correct' : picked ? 'is-wrong' : '';
        const flag = right ? (picked ? 'ตอบถูก' : 'คำตอบที่ถูก') : picked ? 'คุณเลือก' : '';
        return `<div class="choice ${multi ? 'multi' : ''} ${cls}"><span class="bx">${picked ? icon(right ? 'check' : 'x', 17) : (LET[pos] || pos + 1)}</span><span class="tx">${esc(q.choices[ci])}</span><span class="flag">${flag}</span></div>`;
      }).join('')}
      ${q.explanation ? `<div class="why"><b>อธิบาย:</b> ${rich(q.explanation)}</div>` : ''}</div>`;
  }).join('');
}
function resultHtml(res, o) {
  const cls = o.pass === true ? 'pass' : o.pass === false ? 'fail' : '';
  return `<div class="result ${cls}">${ringHtml(res.percent)}<div style="flex:1;min-width:200px">
    <h3 class="mb-0">${esc(o.title)}</h3><p class="mb-0 muted">ตอบถูก ${res.correct}/${res.details.length} ข้อ · ${res.earned}/${res.total} คะแนน${o.passPercent != null ? ` · เกณฑ์ผ่าน ${o.passPercent}%` : ''}</p>${o.extra || ''}</div></div>`;
}

}

actions['quiz-submit'] = async () => {
  if (!QZ || QZ.state !== 'form') return;
  const answers = readAnswers(QZ.items), un = answers.filter(a => !a.length).length;
  if (un && !(await confirmDlg(`ยังไม่ได้ตอบ ${un} ข้อ ต้องการส่งคำตอบเลยหรือไม่?`, { ok: 'ส่งคำตอบ' }))) return;
  const res = grade(QZ.items, answers), { cfg, c, lesson } = QZ, cpv = cp(c.id, true);
  if (!cpv.qs) cpv.qs = {};   // per-question tally [tries, correct] → item analysis in the administrator's dashboard
  res.details.forEach(d => { const e = cpv.qs[d.it.q.id] || (cpv.qs[d.it.q.id] = [0, 0]); e[0]++; if (d.ok) e[1]++; });
  let pass = null;

  else if (cfg.kind === 'lesson') {
    const p = lp(cpv, lesson); p.quiz.attempts++; p.quiz.best = Math.max(p.quiz.best, res.percent);

    pass = res.percent >= cfg.pass; cpv.post.attempts.push({ percent: res.percent, at: Date.now(), passed: pass });

  }
  saveProg();
  QZ.state = 'result'; QZ.result = res; QZ.pass = pass;

/* ---------- lesson + YouTube ---------- */
function loadYT() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (loadYT.p) return loadYT.p;
  loadYT.p = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) try { prev(); } catch (e) { /* ignore */ } res(); };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.dataset.yt = '1';
    s.onerror = () => { loadYT.p = null; rej(new Error('load')); };
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.YT && window.YT.Player)) { loadYT.p = null; rej(new Error('timeout')); } }, 12000);
  });
  return loadYT.p;
}
function destroyPlayer() {
  if (!PLR) return;
  clearInterval(PLR.timer);
  try { if (PLR.player && PLR.player.destroy) PLR.player.destroy(); } catch (e) { /* ignore */ }
  PLR = null; saveProg();
}
const thr = c => Math.min(clamp(num(c.watchPercent, 85), 0, 100), 98) / 100;

function watchHtml() {
  const { c, cpv, lesson } = LC, p = lp(cpv, lesson), vid = ytId(lesson.youtube);
  const yt = vid ? `<a class="btn sm ghost" href="${ytWatch(vid)}" target="_blank" rel="noopener">${icon('external', 16)} เปิดใน YouTube</a>` : '';
  if (!vid) {
    return p.videoDone ? `<span class="tag ok">${icon('check', 14)} อ่านแล้ว</span>` : `<span class="grow muted">อ่านเนื้อหาด้านล่างให้จบ แล้วกดปุ่มเพื่อไปต่อ</span><button class="btn primary" data-action="mark-done">${icon('check', 18)} อ่านจบแล้ว</button>`;
  }
  if (p.videoDone) return `<span class="tag ok">${icon('check', 14)} ดูวิดีโอครบแล้ว</span><span class="grow"></span>${yt}`;
  const manual = c.completion === 'manual' || (PLR && (PLR.fallback || PLR.err));
  const t = Math.round(thr(c) * 100), w = p.duration ? clamp(Math.round(p.watched / p.duration * 100), 0, 100) : 0;
  let h = '';
  if (c.completion === 'watch' && !(PLR && (PLR.fallback || PLR.err))) h += `<span class="small">ดูแล้ว <b>${w}%</b> · ต้องดูอย่างน้อย ${t}%</span><div class="bar-progress" role="progressbar" aria-valuenow="${w}" aria-valuemin="0" aria-valuemax="100"><i style="width:${w}%"></i></div>`;
  else h += `<span class="grow muted small">${PLR && PLR.err ? 'เล่นวิดีโอในหน้านี้ไม่ได้ — กดเปิดใน YouTube แล้วกลับมากดปุ่มเมื่อดูจบ' : 'ดูวิดีโอจนจบ แล้วกดปุ่มเพื่อไปต่อ'}</span>`;
  if (manual) h += `<button class="btn primary" data-action="mark-done">${icon('check', 18)} ฉันดูจบแล้ว</button>`;
  return h + yt;
}
function lnavHtml() {
  const { c, cpv, idx } = LC, ss = stepsOf(c), key = 'l:' + LC.lesson.id, i = ss.findIndex(s => s.key === key);
  const prev = ss[i - 1], next = ss[i + 1];
  const prevHtml = prev ? `<a class="btn" href="${stepHref(c, prev)}">${icon('left', 18)} ${prev.type === 'lesson' ? 'บทก่อนหน้า' : 'ก่อนหน้า'}</a>` : `<a class="btn" href="#/course/${c.id}">${icon('left', 18)} หน้าคอร์ส</a>`;

  else if (canOpen(c, cpv, next)) nextHtml = `<a class="btn primary" href="${stepHref(c, next)}">${nextLabel(next)} ${icon('right', 18)}</a>`;
  else nextHtml = `<span class="small muted" style="align-self:center">${hasQuiz(LC.lesson) ? 'ดูวิดีโอและผ่านแบบทดสอบท้ายบท' : 'เรียนบทนี้ให้จบ'}เพื่อปลดล็อกขั้นต่อไป</span><button class="btn primary" disabled>${nextLabel(next)} ${icon('right', 18)}</button>`;

function refreshLessonUI() {

function afterLessonChange() {
  const { c, cpv, lesson } = LC, p = lp(cpv, lesson);
  if (lessonDone(c, cpv, lesson) && !p.completedAt) { p.completedAt = Date.now(); emit('lesson_done', { course: cinfo(c), lesson: { id: lesson.id, title: lesson.title } }); }
  const finished = refreshCompletion(c, cpv);

}
function markVideoDone(silent) {
  if (!LC) return;
  const { c, cpv, lesson } = LC, p = lp(cpv, lesson);
  if (p.videoDone) return;
  p.videoDone = true; p.watched = Math.max(p.watched, p.duration || 0);

  if (finished) showCongrats(c);
}
actions['mark-done'] = () => markVideoDone();

function mountPlayer() {
  const { c, cpv, lesson } = LC, vid = ytId(lesson.youtube), p = lp(cpv, lesson);
  if (!vid) return;
  const me = PLR = { player: null, timer: null, last: Date.now(), saved: Date.now(), dirty: false, fallback: false, err: null };
  onLeave(destroyPlayer);
  const fallback = () => {
    if (PLR !== me) return; me.fallback = true;
    const w = $('#pwrap'); if (w) w.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&playsinline=1" title="${esc(lesson.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    refreshLessonUI();
  };
  loadYT().then(() => {
    if (PLR !== me) return;
    const start = !p.videoDone && p.pos > 5 ? Math.floor(p.pos) : 0;
    me.player = new window.YT.Player('yt-target', {
      videoId: vid, width: '100%', height: '100%',
      playerVars: { rel: 0, playsinline: 1, modestbranding: 1, start },
      events: {
        onReady: () => { try { const d = me.player.getDuration(); if (d) p.duration = d; } catch (e) { /* ignore */ } me.last = Date.now(); },
        onError: ev => { me.err = ev && ev.data; refreshLessonUI(); },
        onStateChange: ev => { me.last = Date.now(); if (ev.data === 0 && c.completion === 'manual') markVideoDone(); }
      }
    });
    me.timer = setInterval(() => {
      if (PLR !== me || !me.player || !me.player.getPlayerState) return;
      const now = Date.now(), dt = Math.min((now - me.last) / 1000, 3); me.last = now;
      let st = -1; try { st = me.player.getPlayerState(); } catch (e) { return; }
      if (st === 1 && !p.videoDone) {
        const rate = me.player.getPlaybackRate() || 1, d = me.player.getDuration() || p.duration;
        if (d) p.duration = d;
        p.watched = Math.min(p.watched + dt * rate, p.duration || Infinity); p.pos = me.player.getCurrentTime() || p.pos; me.dirty = true;
        if (c.completion === 'watch' && p.duration && p.watched >= p.duration * thr(c)) { markVideoDone(); return; }
        const w = $('#watch'); if (w && !w.dataset.busy) w.innerHTML = watchHtml();
      }
      if (me.dirty && now - me.saved > 5000) { saveProg(); me.saved = now; me.dirty = false; }
    }, 1000);
  }).catch(fallback);
}

    if (j && j.ok && !(j.n > 0)) throw new Error('สคริปต์ในฐานข้อมูลเป็นเวอร์ชันเก่า — ผู้ดูแลระบบต้องวางสคริปต์ใหม่ (เวอร์ชัน 4) เพื่อให้ออกเลขที่เกียรติบัตรได้');
    throw new Error(j && j.error === 'full' ? 'ทะเบียนเกียรติบัตรในฐานข้อมูลเต็ม' : 'ฐานข้อมูลปฏิเสธคำขอเลขที่ (' + ((j && j.error) || '?') + ')');
  }
  return { n: j.n, no: String(j.no || fmtSerial(C, j.n, cfgWhen)), series: serialSeries(c, cfgWhen), src: 'db', at: Date.now(), status: 'ok' };
}
/* who: { key, name, email, org, group, pre, post, at (completedAt), certId } → { n, no, series, src, at } — database first, else this computer's counter */
async function issueSerial(c, who, o) {
  const when = who.at || Date.now();
  if (pubDb() && !(o && o.local)) return dbIssue(c, who, when);
  const n = allocLocal(serialSeries(c, when), numCfg(c.certificate).start);
  return { n, no: fmtSerial(c.certificate, n, when), series: serialSeries(c, when), src: 'local', at: Date.now(), status: 'ok' };
}

const SERIAL_BUSY = {}, SERIAL_ERR = {};
function whoOf(p, cpv) {
  return { key: lkey(p), name: (p.certName || p.name || '').trim(), email: p.email || '', org: p.extra || p.org || '', group: p.group || '', pre: cpv.pre ? cpv.pre.percent : null, post: cpv.post && cpv.post.passed ? cpv.post.best : null, at: cpv.completedAt, certId: cpv.certId };
}
function ensureSerial(c, cpv) {
  if (cpv && cpv.cert && cpv.cert.no) return Promise.resolve(cpv.cert);
  if (!cpv || !cpv.completedAt || !autoSerial(c)) return Promise.resolve(null);
  const p = profile(); if (!p) return Promise.resolve(null);
  const k = c.id + '|' + p.id;
  if (!SERIAL_BUSY[k]) {
    SERIAL_BUSY[k] = (async () => {
      try { const r = await issueSerial(c, whoOf(p, cpv)); cpv.cert = r; saveProg(); delete SERIAL_ERR[k]; return r; }
      catch (e) { SERIAL_ERR[k] = e.message; return null; }
      finally { delete SERIAL_BUSY[k]; }
    })();
  }
  return SERIAL_BUSY[k];
}
function serialSlotHtml(c, cpv) {
  if (cpv.cert && cpv.cert.no && cpv.cert.status !== 'void') return ` · เลขที่ <span class="kbd">${esc(cpv.cert.no)}</span>`;
  if (cpv.cert && cpv.cert.status === 'void') return ` · <span class="tag warn">เกียรติบัตรนี้ถูกยกเลิกโดยผู้ดูแลระบบ</span>`;
  if (!autoSerial(c) || !cpv.completedAt) return '';
  const p = profile(), k = p ? c.id + '|' + p.id : '';
  if (SERIAL_BUSY[k]) return ' · <span class="muted">กำลังขอเลขที่เกียรติบัตร…</span>';
  return ` · <span class="tag warn">ยังไม่ได้เลขที่</span> <button class="btn sm" data-action="cert-retry">${icon('refresh', 14)} ขอเลขที่ใหม่</button>${SERIAL_ERR[k] ? `<div class="small muted mt-s">${esc(SERIAL_ERR[k])}</div>` : ''}`;
}
function paintSerialSlot() {
  const s = $('#cert-no-slot'); if (!s || !CTX) return;
  const cpv = cp(CTX.c.id, false); if (cpv) s.innerHTML = serialSlotHtml(CTX.c, cpv);
}
async function serialThenPaint() {
  if (!CTX) return;
  const c = CTX.c, cpv = cp(c.id, false); if (!cpv) return;
  const had = !!(cpv.cert && cpv.cert.no), pr = ensureSerial(c, cpv); paintSerialSlot();

async function sendPackage(list) {
  if (!list.length) return toast('ไม่มีคอร์สที่ต้องส่ง', 'bad');
  flushSave();
  const pkg = buildPackage(list), file = `prommamooc-${list.length === 1 ? list[0].id : 'courses-' + new Date().toISOString().slice(0, 10)}.pmooc.json`;
  downloadText(file, JSON.stringify(pkg), 'application/json');
  list.forEach(c => { c.sentRev = c.updatedAt; }); saveData();
  await openModal({
    title: 'ได้ไฟล์ส่งผู้ดูแลระบบแล้ว',
    body: `<p>ดาวน์โหลดไฟล์ <span class="kbd">${esc(file)}</span> แล้ว (${list.length} คอร์ส)</p><ol><li>ส่งไฟล์นี้ให้ผู้ดูแลระบบ (อีเมล / LINE / แชร์ไดรฟ์)</li><li>ผู้ดูแลนำเข้าที่เมนู "คอร์สจากครู" ตรวจสอบ แล้วเผยแพร่</li><li>เมื่อผู้ดูแลอัปเดตเว็บแล้ว สถานะที่หน้านี้จะเป็น "เผยแพร่แล้ว"</li></ol><p class="small muted">แก้ไขคอร์สเพิ่มทีหลังได้ แล้วกดส่งใหม่ — ผู้ดูแลจะรับเวอร์ชันล่าสุดแทนของเดิม</p>`,
    actions: [{ label: 'เข้าใจแล้ว', value: true, cls: 'primary' }]
  });
  rerender();
}

/* ---------- publish: build a standalone index.html with current data ---------- */
async function buildHtml() {
  if (hasRoster()) await syncAccounts();
  flushSave(); DATA.updatedAt = Date.now(); store.set(LS.data, { data: DATA });
  const json = JSON.stringify(exportData(), null, 1).replace(/</g, '\\u003c');
  let src = null;
  if (/^https?:$/.test(location.protocol)) {   // served from a web host: patch the original source; from file:// fall back to the DOM
    try { const r = await fetch(location.href.split('#')[0], { cache: 'no-store' }); if (r.ok) { const t = await r.text(); if (/<script id="pmooc-data" type="application\/json">/.test(t)) src = t; } } catch (e) { /* use DOM */ }
  }
  if (src) return src.replace(/(<script id="pmooc-data" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + '\n' + json + '\n' + b);
  const cl = document.documentElement.cloneNode(true);
  ['#app', '#overlay', '#toasts'].forEach(s => { const n = cl.querySelector(s); if (n) n.innerHTML = ''; });
  cl.querySelector('#theme-vars').textContent = '';
  cl.querySelectorAll('script[src]').forEach(n => n.remove());
  cl.querySelector('#pmooc-data').textContent = '\n' + json + '\n';
  cl.querySelector('title').textContent = DATA.settings.siteName;
  const b = cl.querySelector('body'); b.removeAttribute('class'); b.removeAttribute('style'); cl.removeAttribute('style');
  return '<!DOCTYPE html>\n' + cl.outerHTML;
}
actions['pub-html'] = async () => {
  if (!isAdmin()) return;
  try {
    const html = await buildHtml(); downloadText('index.html', html, 'text/html');
    openModal({ title: 'ได้ไฟล์ index.html แล้ว', body: `<p>ไฟล์นี้ฝังคอร์สล่าสุดไว้ครบ ขั้นตอนต่อไป:</p><ol><li>เปิด repository บน GitHub → <b>Add file → Upload files</b></li><li>ลากไฟล์ <span class="kbd">index.html</span> ที่เพิ่งดาวน์โหลดไปวาง (ทับไฟล์เดิม)</li><li>กด <b>Commit changes</b> แล้วรอ 1–2 นาที</li></ol><p class="small muted">ถ้าใช้ iPad ไฟล์จะอยู่ในแอป "ไฟล์" → ดาวน์โหลด</p>`, actions: [{ label: 'เข้าใจแล้ว', value: true, cls: 'primary' }] });
