/* ---------- quiz engine ---------- */
function buildItems(questions, shuffleQ, shuffleC) {
  let items = questions.map(q => ({ q, order: shuffleC && q.type !== 'tf' ? shuffle(q.choices.map((_, i) => i)) : q.choices.map((_, i) => i) }));
  if (shuffleQ) items = shuffle(items);
  return items;
}
const LET = ['ก', 'ข', 'ค', 'ง', 'จ', 'ฉ', 'ช', 'ซ', 'ฌ', 'ญ'];   // Thai choice letters
function ringHtml(p) {
  p = clamp(Math.round(p), 0, 100);
  return `<div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="44"/><circle class="val" cx="50" cy="50" r="44" pathLength="100" style="stroke-dashoffset:${100 - p};${p ? '' : 'opacity:0'}"/></svg><b>${p}%</b></div>`;
}
function qHtml(it, n) {
  const q = it.q, multi = q.type === 'multi';
  return `<fieldset class="q" data-n="${n}"><legend><span class="qn">${n + 1}</span><span>${esc(q.text)}${multi ? '<span class="hint">เลือกได้มากกว่า 1 ข้อ</span>' : ''}</span></legend>
    ${q.image ? `<img class="qimg" src="${esc(q.image)}" alt="">` : ''}
    ${it.order.map((ci, pos) => `<label class="choice ${multi ? 'multi' : ''}"><input type="${multi ? 'checkbox' : 'radio'}" name="q${n}" value="${ci}"><span class="bx">${LET[pos] || pos + 1}</span><span class="tx">${esc(q.choices[ci])}</span></label>`).join('')}</fieldset>`;
}
const quizFormHtml = items => `<div id="quizform" class="quiz">${items.map(qHtml).join('')}
  <div class="qbar"><div class="qprog"><span class="muted small" id="qcount">ตอบแล้ว 0/${items.length} ข้อ</span><div class="bar-progress"><i id="qfill" style="width:0"></i></div></div><button type="button" class="btn primary" data-action="quiz-submit">ส่งคำตอบ</button></div></div>`;
function updateQCount() {
  const f = $('#quizform'); if (!f) return;
  const n = $$('fieldset.q', f).filter(q => $('input:checked', q)).length;
  const t = $$('fieldset.q', f).length;
  $('#qcount').textContent = `ตอบแล้ว ${n}/${t} ข้อ`; $('#qfill').style.width = pct(n, t) + '%';
}
function readAnswers(items) {
  const f = $('#quizform');
  return items.map((_, n) => $$(`fieldset[data-n="${n}"] input:checked`, f).map(i => Number(i.value)));
}
function grade(items, answers) {
  let earned = 0, total = 0;
  const details = items.map((it, n) => {
    const pts = num(it.q.points, 1) > 0 ? num(it.q.points, 1) : 1, sel = answers[n] || [];
    const ok = sel.length === it.q.answer.length && it.q.answer.every(i => sel.includes(i));
    total += pts; if (ok) earned += pts;
    return { it, sel, ok };
  });
  return { earned, total, percent: pct(earned, total), details, correct: details.filter(d => d.ok).length };
}
function reviewHtml(res) {
  return res.details.map((d, n) => {
    const q = d.it.q, multi = q.type === 'multi';
    return `<div class="q review ${d.ok ? 'ok' : 'no'}"><legend style="display:flex;gap:10px;font-weight:600;margin-bottom:12px"><span class="qn">${n + 1}</span><span>${esc(q.text)} ${d.ok ? '<span class="tag ok">ถูกต้อง</span>' : '<span class="tag warn">ยังไม่ถูกต้อง</span>'}</span></legend>
      ${q.image ? `<img class="qimg" src="${esc(q.image)}" alt="">` : ''}
      ${d.it.order.map((ci, pos) => {
        const right = q.answer.includes(ci), picked = d.sel.includes(ci);
        const cls = right ? 'is-correct' : picked ? 'is-wrong' : '';
        const flag = right ? (picked ? 'ตอบถูก' : 'คำตอบที่ถูก') : picked ? 'คุณเลือก' : '';
        return `<div class="choice ${multi ? 'multi' : ''} ${cls}"><span class="bx">${picked ? icon(right ? 'check' : 'x', 17) : (LET[pos] || pos + 1)}</span><span class="tx">${esc(q.choices[ci])}</span><span class="flag">${flag}</span></div>`;
      }).join('')}
      ${q.explanation ? `<div class="why"><b>อธิบาย:</b> ${rich(q.explanation)}</div>` : ''}</div>`;
  }).join('');
}
function resultHtml(res, o) {
  const cls = o.pass === true ? 'pass' : o.pass === false ? 'fail' : '';
  return `<div class="result ${cls}">${ringHtml(res.percent)}<div style="flex:1;min-width:200px">
    <h3 class="mb-0">${esc(o.title)}</h3><p class="mb-0 muted">ตอบถูก ${res.correct}/${res.details.length} ข้อ · ${res.earned}/${res.total} คะแนน${o.passPercent != null ? ` · เกณฑ์ผ่าน ${o.passPercent}%` : ''}</p>${o.extra || ''}</div></div>`;
}
function compareHtml(cpv) {

  const a = cpv.pre.percent, b = cpv.post.best, d = b - a;
  return `<div class="compare"><div><span>ก่อนเรียน</span><b>${a}%</b></div><div><span>หลังเรียน (สูงสุด)</span><b>${b}%</b></div><div><span>พัฒนาการ</span><b style="color:${d >= 0 ? 'var(--ok)' : 'var(--bad)'}">${d >= 0 ? '+' : ''}${d}</b></div></div>`;
}
function quizCfg(kind, c, l) {

function nextHref(c, cpv, fromKey) {
  const ss = stepsOf(c), i = ss.findIndex(s => s.key === fromKey), s2 = ss[i + 1];

function renderQuiz() { const b = $('#quizbox'); if (b && QZ) b.innerHTML = quizBoxHtml(); }
actions['quiz-start'] = () => {
  if (!QZ) return; const { cfg } = QZ;

actions['quiz-retry'] = actions['quiz-start'];
actions['quiz-submit'] = async () => {
  if (!QZ || QZ.state !== 'form') return;
  const answers = readAnswers(QZ.items), un = answers.filter(a => !a.length).length;
  if (un && !(await confirmDlg(`ยังไม่ได้ตอบ ${un} ข้อ ต้องการส่งคำตอบเลยหรือไม่?`, { ok: 'ส่งคำตอบ' }))) return;
  const res = grade(QZ.items, answers), { cfg, c, lesson } = QZ, cpv = cp(c.id, true);
  if (!cpv.qs) cpv.qs = {};   // per-question tally [tries, correct] → item analysis in the administrator's dashboard
  res.details.forEach(d => { const e = cpv.qs[d.it.q.id] || (cpv.qs[d.it.q.id] = [0, 0]); e[0]++; if (d.ok) e[1]++; });
  let pass = null;
  const base = { course: cinfo(c), score: res.earned, total: res.total, percent: res.percent };
  if (cfg.kind === 'pre') { cpv.pre = { percent: res.percent, score: res.earned, total: res.total, at: Date.now() }; emit('pretest', base); }
  else if (cfg.kind === 'lesson') {
    const p = lp(cpv, lesson); p.quiz.attempts++; p.quiz.best = Math.max(p.quiz.best, res.percent);
    pass = res.percent >= cfg.pass; if (pass) p.quiz.passed = true;
    emit('lesson_quiz', Object.assign({ lesson: { id: lesson.id, title: lesson.title }, passed: pass, attempt: p.quiz.attempts }, base));
  } else {
    pass = res.percent >= cfg.pass; cpv.post.attempts.push({ percent: res.percent, at: Date.now(), passed: pass });
    cpv.post.best = Math.max(cpv.post.best, res.percent); if (pass) cpv.post.passed = true;
    emit('posttest', Object.assign({ passed: pass, attempt: cpv.post.attempts.length, pre: cpv.pre ? cpv.pre.percent : null }, base));
  }
  saveProg();
  QZ.state = 'result'; QZ.result = res; QZ.pass = pass;
  let finished = false;
  if (cfg.kind === 'lesson') finished = afterLessonChange(); else finished = refreshCompletion(c, cpv);

};

/* ---------- lesson + YouTube ---------- */
function loadYT() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (loadYT.p) return loadYT.p;
  loadYT.p = new Promise((res, rej) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (prev) try { prev(); } catch (e) { /* ignore */ } res(); };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.dataset.yt = '1';
    s.onerror = () => { loadYT.p = null; rej(new Error('load')); };
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.YT && window.YT.Player)) { loadYT.p = null; rej(new Error('timeout')); } }, 12000);
  });
  return loadYT.p;
}
function destroyPlayer() {
  if (!PLR) return;
  clearInterval(PLR.timer);
  try { if (PLR.player && PLR.player.destroy) PLR.player.destroy(); } catch (e) { /* ignore */ }
  PLR = null; saveProg();
}
const thr = c => Math.min(clamp(num(c.watchPercent, 85), 0, 100), 98) / 100;

function watchHtml() {
  const { c, cpv, lesson } = LC, p = lp(cpv, lesson), vid = ytId(lesson.youtube);
  const yt = vid ? `<a class="btn sm ghost" href="${ytWatch(vid)}" target="_blank" rel="noopener">${icon('external', 16)} เปิดใน YouTube</a>` : '';
  if (!vid) {
    return p.videoDone ? `<span class="tag ok">${icon('check', 14)} อ่านแล้ว</span>` : `<span class="grow muted">อ่านเนื้อหาด้านล่างให้จบ แล้วกดปุ่มเพื่อไปต่อ</span><button class="btn primary" data-action="mark-done">${icon('check', 18)} อ่านจบแล้ว</button>`;
  }
  if (p.videoDone) return `<span class="tag ok">${icon('check', 14)} ดูวิดีโอครบแล้ว</span><span class="grow"></span>${yt}`;
  const manual = c.completion === 'manual' || (PLR && (PLR.fallback || PLR.err));
  const t = Math.round(thr(c) * 100), w = p.duration ? clamp(Math.round(p.watched / p.duration * 100), 0, 100) : 0;
  let h = '';
  if (c.completion === 'watch' && !(PLR && (PLR.fallback || PLR.err))) h += `<span class="small">ดูแล้ว <b>${w}%</b> · ต้องดูอย่างน้อย ${t}%</span><div class="bar-progress" role="progressbar" aria-valuenow="${w}" aria-valuemin="0" aria-valuemax="100"><i style="width:${w}%"></i></div>`;
  else h += `<span class="grow muted small">${PLR && PLR.err ? 'เล่นวิดีโอในหน้านี้ไม่ได้ — กดเปิดใน YouTube แล้วกลับมากดปุ่มเมื่อดูจบ' : 'ดูวิดีโอจนจบ แล้วกดปุ่มเพื่อไปต่อ'}</span>`;
  if (manual) h += `<button class="btn primary" data-action="mark-done">${icon('check', 18)} ฉันดูจบแล้ว</button>`;
  return h + yt;
}
function lnavHtml() {
  const { c, cpv, idx } = LC, ss = stepsOf(c), key = 'l:' + LC.lesson.id, i = ss.findIndex(s => s.key === key);
  const prev = ss[i - 1], next = ss[i + 1];
  const prevHtml = prev ? `<a class="btn" href="${stepHref(c, prev)}">${icon('left', 18)} ${prev.type === 'lesson' ? 'บทก่อนหน้า' : 'ก่อนหน้า'}</a>` : `<a class="btn" href="#/course/${c.id}">${icon('left', 18)} หน้าคอร์ส</a>`;
  let nextHtml;
  if (!next) nextHtml = `<a class="btn primary" href="#/course/${c.id}">กลับหน้าคอร์ส</a>`;
  else if (canOpen(c, cpv, next)) nextHtml = `<a class="btn primary" href="${stepHref(c, next)}">${nextLabel(next)} ${icon('right', 18)}</a>`;
  else nextHtml = `<span class="small muted" style="align-self:center">${hasQuiz(LC.lesson) ? 'ดูวิดีโอและผ่านแบบทดสอบท้ายบท' : 'เรียนบทนี้ให้จบ'}เพื่อปลดล็อกขั้นต่อไป</span><button class="btn primary" disabled>${nextLabel(next)} ${icon('right', 18)}</button>`;
  return prevHtml + nextHtml;
}
function refreshLessonUI() {

  const w = $('#watch'); if (w) w.innerHTML = watchHtml();
  const n = $('#lnav'); if (n) n.innerHTML = lnavHtml();

function afterLessonChange() {
  const { c, cpv, lesson } = LC, p = lp(cpv, lesson);
  if (lessonDone(c, cpv, lesson) && !p.completedAt) { p.completedAt = Date.now(); emit('lesson_done', { course: cinfo(c), lesson: { id: lesson.id, title: lesson.title } }); }
  const finished = refreshCompletion(c, cpv);
  saveProg(); refreshLessonUI();
  return finished;
}
function markVideoDone(silent) {
  if (!LC) return;
  const { c, cpv, lesson } = LC, p = lp(cpv, lesson);
  if (p.videoDone) return;
  p.videoDone = true; p.watched = Math.max(p.watched, p.duration || 0);

  if (!silent) toast(hasQuiz(lesson) ? 'ครบแล้ว — ทำแบบทดสอบท้ายบทต่อได้เลย' : 'จบบทเรียนแล้ว', 'ok');
  if (finished) showCongrats(c);
}
actions['mark-done'] = () => markVideoDone();

function mountPlayer() {
  const { c, cpv, lesson } = LC, vid = ytId(lesson.youtube), p = lp(cpv, lesson);
  if (!vid) return;
  const me = PLR = { player: null, timer: null, last: Date.now(), saved: Date.now(), dirty: false, fallback: false, err: null };
  onLeave(destroyPlayer);
  const fallback = () => {
    if (PLR !== me) return; me.fallback = true;
    const w = $('#pwrap'); if (w) w.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&playsinline=1" title="${esc(lesson.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    refreshLessonUI();
  };
  loadYT().then(() => {
    if (PLR !== me) return;
    const start = !p.videoDone && p.pos > 5 ? Math.floor(p.pos) : 0;
    me.player = new window.YT.Player('yt-target', {
      videoId: vid, width: '100%', height: '100%',
      playerVars: { rel: 0, playsinline: 1, modestbranding: 1, start },
      events: {
        onReady: () => { try { const d = me.player.getDuration(); if (d) p.duration = d; } catch (e) { /* ignore */ } me.last = Date.now(); },
        onError: ev => { me.err = ev && ev.data; refreshLessonUI(); },
        onStateChange: ev => { me.last = Date.now(); if (ev.data === 0 && c.completion === 'manual') markVideoDone(); }
      }
    });
    me.timer = setInterval(() => {
      if (PLR !== me || !me.player || !me.player.getPlayerState) return;
      const now = Date.now(), dt = Math.min((now - me.last) / 1000, 3); me.last = now;
      let st = -1; try { st = me.player.getPlayerState(); } catch (e) { return; }
      if (st === 1 && !p.videoDone) {
        const rate = me.player.getPlaybackRate() || 1, d = me.player.getDuration() || p.duration;
        if (d) p.duration = d;
        p.watched = Math.min(p.watched + dt * rate, p.duration || Infinity); p.pos = me.player.getCurrentTime() || p.pos; me.dirty = true;
        if (c.completion === 'watch' && p.duration && p.watched >= p.duration * thr(c)) { markVideoDone(); return; }
        const w = $('#watch'); if (w && !w.dataset.busy) w.innerHTML = watchHtml();
      }
      if (me.dirty && now - me.saved > 5000) { saveProg(); me.saved = now; me.dirty = false; }
    }, 1000);
  }).catch(fallback);
}

/* ---------- publish: build a standalone index.html with current data ---------- */
async function buildHtml() {
  if (hasRoster()) await syncAccounts();
  flushSave(); DATA.updatedAt = Date.now(); store.set(LS.data, { data: DATA });
  const json = JSON.stringify(exportData(), null, 1).replace(/</g, '\\u003c');
  let src = null;
  if (/^https?:$/.test(location.protocol)) {   // served from a web host: patch the original source; from file:// fall back to the DOM
    try { const r = await fetch(location.href.split('#')[0], { cache: 'no-store' }); if (r.ok) { const t = await r.text(); if (/<script id="pmooc-data" type="application\/json">/.test(t)) src = t; } } catch (e) { /* use DOM */ }
  }
  if (src) return src.replace(/(<script id="pmooc-data" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + '\n' + json + '\n' + b);
  const cl = document.documentElement.cloneNode(true);
  ['#app', '#overlay', '#toasts'].forEach(s => { const n = cl.querySelector(s); if (n) n.innerHTML = ''; });
  cl.querySelector('#theme-vars').textContent = '';
  cl.querySelectorAll('script[src]').forEach(n => n.remove());
  cl.querySelector('#pmooc-data').textContent = '\n' + json + '\n';
  cl.querySelector('title').textContent = DATA.settings.siteName;
  const b = cl.querySelector('body'); b.removeAttribute('class'); b.removeAttribute('style'); cl.removeAttribute('style');
  return '<!DOCTYPE html>\n' + cl.outerHTML;
}

/* ----- bulk import of questions from text ----- */
function parseBulk(text) {
  const blocks = text.replace(/\r/g, '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const out = []; let bad = 0;
  blocks.forEach(b => {
    const q = newQuestion(); q.choices = []; q.answer = []; const head = [];
    b.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
      const m = l.match(/^([+\-*?])\s*(.*)$/);
      if (m && m[1] === '+') { q.answer.push(q.choices.length); q.choices.push(m[2]); }
      else if (m && (m[1] === '-' || m[1] === '*')) q.choices.push(m[2]);
      else if (m && m[1] === '?') q.explanation = (q.explanation ? q.explanation + '\n' : '') + m[2];
      else head.push(l.replace(/^\d+\s*[.)]\s*/, ''));
    });
    q.text = head.join('\n');
    if (!q.text || q.choices.length < 2 || !q.answer.length) { bad++; return; }
    if (q.choices.length === 2 && q.choices[0] === 'จริง' && q.choices[1] === 'เท็จ') q.type = 'tf';
    else if (q.answer.length > 1) q.type = 'multi';
    out.push(q);
  });
  return { out, bad };
}

function pickFiles(accept) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.multiple = true; i.accept = accept || '';
    i.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(i);
    i.onchange = () => { res(Array.from(i.files)); i.remove(); };
    i.addEventListener('cancel', () => { res([]); i.remove(); });
    i.click();
  });
}
async function withProgress(title, fn) {
  const root = $('#overlay'), wrap = document.createElement('div'); wrap.className = 'backdrop';
  wrap.innerHTML = `<div class="modal" role="alertdialog" aria-label="${esc(title)}"><div class="modal-b" style="padding:26px 24px"><h3>${esc(title)}</h3><div class="bar-progress mt-s"><i id="pg-fill" style="width:3%"></i></div><p class="small muted mt-s mb-0" id="pg-text">กำลังเตรียม…</p></div></div>`;
  root.appendChild(wrap); document.body.classList.add('modal-open');
  const upd = (n, t) => { const f = $('#pg-fill'); if (f) f.style.width = Math.max(3, pct(n, t)) + '%'; const x = $('#pg-text'); if (x) x.textContent = `${n} / ${t} บัญชี`; };
  try { await tick(); return await fn(upd); } finally { wrap.remove(); if (!root.children.length) document.body.classList.remove('modal-open'); }
}

function usersSummary() {

function importPreviewHtml(pr, plan) {

    ${rows.map(i => `<tr><td>${i.line}</td><td><b>${esc(i.user.name)}</b><div class="small muted">${esc(i.user.email)}</div></td><td>${roleTag(i.user.role)}</td><td>${esc(i.user.group)}</td><td>${st(i)}</td></tr>`).join('')}</tbody></table></div>

}
actions['u-import'] = async () => {
  const f = await pickFile('.xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); if (!f) return;
  let rows;
  try {
    if (/\.csv$/i.test(f.name)) rows = parseCSV(await readText(f));
    else if (/\.xls$/i.test(f.name)) throw new Error('ไฟล์ .xls (Excel รุ่นเก่า) ยังไม่รองรับ — เปิดใน Excel แล้ว "บันทึกเป็น" .xlsx');
    else rows = xlsxRead(await readBuf(f), TEMPLATE_SHEET).rows;
  } catch (e) { return toast('อ่านไฟล์ไม่ได้: ' + e.message, 'bad', 7000); }
  const pr = parseUserRows(rows);
  if (pr.missing.length) return toast(`ไม่พบคอลัมน์ "${pr.missing.join('", "')}" ในไฟล์ — ใช้ไฟล์จากเทมเพลตของระบบ (ปุ่ม "เทมเพลต Excel")`, 'bad', 7000);
  if (!pr.items.length) return toast('ไม่พบรายชื่อในไฟล์ (มีแต่แถวหัวคอลัมน์)', 'bad', 5000);
  const known = new Set((DATA.users || []).map(u => u.email)), accIds = new Set(DATA.auth.accounts.map(a => a.i));
  const isUpdate = e => known.has(e) || (!!DATA.auth.salt && accIds.has(acctIdOf(e, DATA.auth.salt)));
  const good = pr.items.filter(i => !i.skipped && !i.errors.length);
  const plan = { isUpdate, nNew: good.filter(i => !isUpdate(i.user.email)).length, nUpd: good.filter(i => isUpdate(i.user.email)).length, nSkip: pr.items.filter(i => i.skipped).length, nErr: pr.items.filter(i => !i.skipped && i.errors.length).length, nGen: good.filter(i => i.gen && !known.has(i.user.email)).length };
  if (!good.length) { await alertDlg('นำเข้าไม่ได้', importPreviewHtml(pr, plan)); return; }
  const go = await openModal({
    title: `ตรวจสอบก่อนนำเข้า — ${f.name}`, wide: true, body: importPreviewHtml(pr, plan),
    actions: [{ label: 'ยกเลิก', value: null, cls: 'ghost' }, { label: `นำเข้า ${good.length} รายการ`, cls: 'primary', collect: m => ({ replace: !!($('#imp-replace', m) && $('#imp-replace', m).checked) }) }]
  });
  if (!go) return;
  const out = await withProgress('กำลังเข้ารหัสบัญชี…', async upd => {
    ensureRoster(); const imported = [], inFile = new Set(pr.items.filter(i => EMAIL_RE.test(i.user.email)).map(i => i.user.email));
    good.forEach(i => {
      const ex = findUser(i.user.email);
      if (i.gen) i.user.password = ex ? ex.password : genPassword();
      upsertUser(i.user); imported.push(findUser(i.user.email));
    });
    let removed = 0;
    if (go.replace) { const before = DATA.users.length; DATA.users = DATA.users.filter(u => u.role !== 'student' || inFile.has(u.email)); removed = before - DATA.users.length; }
    await syncAccounts(upd); saveData();
    return { imported, removed };
  });
  redrawUsers();
  const generated = good.filter(i => i.gen && !known.has(i.user.email)).length;
  const v = await openModal({
    title: 'นำเข้ารายชื่อเรียบร้อย',
    body: `<p>เพิ่มใหม่ <b>${plan.nNew}</b> · อัปเดต <b>${plan.nUpd}</b>${out.removed ? ` · ลบนักเรียนที่ไม่อยู่ในไฟล์ <b>${out.removed}</b>` : ''}</p>
      <div class="callout warn">${icon('info')}<div class="small"><b>ขั้นต่อไป:</b> กด "ดาวน์โหลด index.html" (หน้าภาพรวม) แล้วอัปโหลดทับไฟล์เดิมบน GitHub — บัญชีเหล่านี้จึงจะเข้าสู่ระบบบนเว็บจริงได้</div></div>
      ${generated ? `<p class="small">มี ${generated} คนที่ระบบสุ่มรหัสผ่านให้ — ดาวน์โหลดรายชื่อพร้อมรหัสเพื่อแจกจ่ายได้ที่ปุ่มด้านล่าง</p>` : ''}`,
    actions: [{ label: 'ดาวน์โหลดรายชื่อพร้อมรหัสผ่าน', value: 'dl', cls: '' }, { label: 'ไปหน้าเผยแพร่', value: 'pub', cls: 'primary' }, { label: 'ปิด', value: null, cls: 'ghost' }]
  });
  if (v === 'dl') xlsxFile('prommamooc-users-imported-' + new Date().toISOString().slice(0, 10) + '.xlsx', usersXlsx(out.imported));
  else if (v === 'pub') location.hash = '#/admin';
};

route(/^\/admin\/inbox$/, () => staffGuard(() => ({ title: 'กล่องรับเรื่อง', admin: true, html: inboxHtml() }), { admin: true }));
function inboxRow(it) {
  if (!it.course) return requestRow(it);
  const c = it.course, ex = DATA.courses.find(x => x.id === c.id), sameOwner = !!ex && !!ex.owner && ownerIs(ex, c.owner);
  const kind = !ex ? ['ใหม่', 'ok'] : sameOwner ? ['อัปเดตคอร์สเดิม', ''] : ['รหัสคอร์สซ้ำกับคอร์สอื่น — จะรับเป็นคอร์สใหม่', 'warn'];
  const older = sameOwner && (c.updatedAt || 0) < (ex.updatedAt || 0);
  const known = hasRoster() ? findUser(it.from.email) : null;

const lkey = p => (p.email ? 'e:' + normEmail(p.email) : 'i:' + (p.id || p.name));

/* ---------- normalising / ranking one learner×course progress record ---------- */
function fixCP(v) {
  v = v && typeof v === 'object' ? v : {};
  if (!v.lessons || typeof v.lessons !== 'object') v.lessons = {};
  if (!v.post || typeof v.post !== 'object') v.post = {};
  if (!Array.isArray(v.post.attempts)) v.post.attempts = [];
  v.post.best = num(v.post.best, 0); v.post.passed = !!v.post.passed;
  if (!v.qs || typeof v.qs !== 'object') v.qs = {};
  return v;
}
const lastAt = v => Math.max(v.startedAt || 0, v.pre ? v.pre.at || 0 : 0, v.completedAt || 0, ...v.post.attempts.map(a => a.at || 0));
function cpUnits(v) { let n = (v.pre ? 1 : 0) + v.post.attempts.length; Object.keys(v.lessons).forEach(k => { const l = v.lessons[k] || {}; n += (l.videoDone ? 1 : 0) + (l.quiz ? l.quiz.attempts || 0 : 0); }); return n; }
const cpRank = v => (v.completedAt ? 1e9 : 0) + cpUnits(v) * 1e3 + Math.min(999, lastAt(v) / 2e9);

/* ---------- pooling learners from every source ---------- */
function collectLearners() {
  const map = new Map();
  const put = (p, prog, src) => {
    if (p.role === 'admin' || p.role === 'teacher') return;
    const key = lkey(p);
    let L = map.get(key);
    if (!L) { L = { key, name: '', email: normEmail(p.email || ''), group: '', sid: '', org: '', courses: {}, src: {}, demo: !!p.demo }; map.set(key, L); }
    L.name = L.name || p.name || ''; L.group = L.group || p.group || ''; L.sid = L.sid || p.sid || ''; L.org = L.org || p.extra || p.org || '';
    L.src[src] = true; if (!p.demo) L.demo = false;
    Object.keys(prog || {}).forEach(cid => { if (!prog[cid]) return; const n = fixCP(deep(prog[cid])), o = L.courses[cid]; if (!o || cpRank(n) >= cpRank(o)) L.courses[cid] = n; });
  };
  IMPORTED.learners.forEach(x => put(x, x.progress, x.demo ? 'demo' : x.src || 'file'));
  PROFILES.forEach(p => put(p, PROG[p.id], 'local'));
  map.forEach((L, k) => {
    const u = L.email && findUser(L.email);
    if (u) { if (u.role !== 'student') { map.delete(k); return; } L.name = u.name; L.group = u.group || L.group; L.sid = u.sid || L.sid; L.org = u.org || L.org; }
    if (!L.name) L.name = L.email || 'ไม่ทราบชื่อ';
  });
  return map;
}
function analyticsRows(f, pool) {
  pool = pool || collectLearners();
  const since = !f.range || f.range === 'all' ? 0 : Date.now() - num(f.range) * 864e5;
  const courses = f.course === 'all' ? DATA.courses : DATA.courses.filter(c => c.id === f.course), out = [];
  pool.forEach(L => {
    if (f.group && f.group !== 'all' && !splitList(L.group).includes(f.group.toLowerCase())) return;
    courses.forEach(c => {
      const v = L.courses[c.id]; if (!v) return;
      if (since && (v.startedAt || 0) < since) return;
      const st = status(c, v);
      out.push({ L, c, v, st, pre: v.pre ? v.pre.percent : null, post: v.post.attempts.length ? v.post.best : null, tries: v.post.attempts.length, state: st.complete ? 'done' : st.done > 0 ? 'active' : 'idle', start: v.startedAt || 0, last: lastAt(v) });
    });
  });
  return out;
}
function summarize(rows) {
  const s = { n: rows.length, done: 0, active: 0, idle: 0, learners: new Set(), certs: 0, pre: [], post: [], gain: [], postPass: 0, prog: [] };
  rows.forEach(r => {
    s[r.state]++; s.learners.add(r.L.key); if (r.v.certId && r.v.completedAt) s.certs++;
    if (r.pre != null) s.pre.push(r.pre);
    if (r.post != null) { s.post.push(r.post); if (r.v.post.passed) s.postPass++; }
    if (r.pre != null && r.post != null) s.gain.push(r.post - r.pre);
    s.prog.push(r.st.percent);
  });
  s.learnerN = s.learners.size; s.rate = pct(s.done, s.n); s.avgPre = avg(s.pre); s.avgPost = avg(s.post); s.avgGain = avg(s.gain); s.passRate = pct(s.postPass, s.post.length); s.avgProg = avg(s.prog);
  return s;
}
function weeklySeries(rows) {
  const W = 7 * 864e5, now = Date.now(); let min = now; rows.forEach(r => { if (r.start && r.start < min) min = r.start; });
  const n = clamp(Math.ceil((now - min) / W), 2, 26), enr = new Array(n).fill(0), fin = new Array(n).fill(0);
  const idx = t => n - 1 - Math.floor((now - t) / W);
  rows.forEach(r => { if (r.start) { const i = idx(r.start); if (i >= 0 && i < n) enr[i]++; } if (r.state === 'done' && r.v.completedAt) { const i = idx(r.v.completedAt); if (i >= 0 && i < n) fin[i]++; } });
  return { labels: enr.map((_, i) => shortDate(now - (n - i) * W)), series: [{ name: 'ลงทะเบียนเรียน', color: C_ENROLL, vals: enr }, { name: 'เรียนจบ', color: C_DONE, vals: fin }] };
}

}

function makeDemo(seed) {

      for (const l of c.lessons) {
        if (!alive) break; if (rnd() < 0.1) { alive = false; break; }
        const p = lp(v, l); p.videoDone = true; t += Math.floor(rnd() * 2e6 + 3e5);
        if (hasQuiz(l)) { const tries = rnd() < 0.7 ? 1 : 2; for (let k = 0; k < tries; k++) { p.quiz.attempts++; const pc = clamp(Math.round(ab * 100 + (rnd() - 0.5) * 36 + k * 8), 0, 100); p.quiz.best = Math.max(p.quiz.best, pc); tally(l.quiz.questions); if (pc >= l.quiz.passPercent) { p.quiz.passed = true; break; } } if (!p.quiz.passed) alive = false; }
      }
      if (alive && postOn(c)) { for (let k = 0; k < 3; k++) { const pc = clamp(Math.round(ab * 84 + 12 + (rnd() - 0.5) * 24 + k * 6), 0, 100), ps = pc >= c.postTest.passPercent; t += 864e5 * 0.3; v.post.attempts.push({ percent: pc, at: Math.min(t, now), passed: ps }); v.post.best = Math.max(v.post.best, pc); tally(c.postTest.questions); if (ps) { v.post.passed = true; break; } } }
      if (status(c, v).complete) { v.completedAt = Math.min(t + 6e5, now); v.certId = `${c.certificate.idPrefix || 'PM'}-DEMO-${String(i).padStart(3, '0')}`; }
      progress[c.id] = v;
    });
    if (Object.keys(progress).length) out.push({ id: 'demo-' + i, name, email: `demo${String(i + 1).padStart(2, '0')}@example.invalid`, group: g, sid: String(11000 + i), extra: 'ข้อมูลตัวอย่าง', role: 'student', src: 'file', demo: true, progress });

}

      <label class="field"><span class="lb">อีเมล <span class="req">*</span></span><input type="email" id="ts-email" autocomplete="email" autocapitalize="off" spellcheck="false" inputmode="email"><span class="help">ใช้เป็นชื่อผู้ใช้ตอนเข้าสู่ระบบ</span></label>
      <div class="grid2"><label class="field"><span class="lb">โรงเรียน / หน่วยงาน</span><input type="text" id="ts-org" value="${esc(S.orgName || '')}"></label><label class="field"><span class="lb">เบอร์โทรติดต่อ</span><input type="tel" id="ts-phone" autocomplete="tel" inputmode="tel"></label></div>
      <label class="field"><span class="lb">วิชา / หัวข้อที่จะสอน</span><input type="text" id="ts-subject" placeholder="เช่น คณิตศาสตร์ ม.ต้น"></label>
      <label class="field"><span class="lb">หมายเหตุถึงผู้ดูแล</span><textarea id="ts-note" rows="3"></textarea></label>
      <button class="btn primary lg" data-action="ts-make" style="width:100%">สร้างคำขอสมัคร</button>
      <p class="help center mt-s">ข้อมูลนี้ไม่ถูกส่งออกจากเครื่องคุณ จนกว่าคุณจะส่งไฟล์ให้ผู้ดูแลเอง</p></div></div>`,
    mount() { const e = $('#ts-name'); if (e) e.focus(); }
  };
});
actions['ts-make'] = () => {
  const r = cleanReq({ name: $('#ts-name').value, email: $('#ts-email').value, org: $('#ts-org').value, phone: $('#ts-phone').value, subject: $('#ts-subject').value, note: $('#ts-note').value });
  if (r.name.length < 2) return toast('กรุณากรอกชื่อ–นามสกุล', 'bad');
  if (!EMAIL_RE.test(r.email)) return toast('รูปแบบอีเมลไม่ถูกต้อง', 'bad');
  TS_DONE = r; rerender(); window.scrollTo(0, 0);
};
actions['ts-download'] = () => { if (!TS_DONE) return; downloadText('teacher-request-' + TS_DONE.email.replace(/[^a-z0-9]+/g, '_') + '.pmooc.json', JSON.stringify({ app: 'prommamooc', kind: 'teacher-request', v: 1, at: new Date().toISOString(), person: TS_DONE }), 'application/json'); toast('ดาวน์โหลดไฟล์คำขอแล้ว — ส่งให้ผู้ดูแลระบบ', 'ok', 5000); };
actions['ts-copy'] = async () => { if (!TS_DONE) return; toast((await copyText(reqToText(TS_DONE))) ? 'คัดลอกรหัสคำขอแล้ว — วางส่งให้ผู้ดูแลได้เลย' : 'คัดลอกไม่สำเร็จ ใช้ปุ่มดาวน์โหลดไฟล์แทน', 'ok', 5000); };
actions['ts-again'] = () => { TS_DONE = null; rerender(); };


/* =====================================================================
   Global events + boot
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (!fn) return;
  try {
    const r = fn(el, e);
    if (r && typeof r.catch === 'function') r.catch(err => { console.error(err); toast('เกิดข้อผิดพลาด: ' + err.message, 'bad', 5000); });
  } catch (err) { console.error(err); toast('เกิดข้อผิดพลาด: ' + err.message, 'bad', 5000); }
});
document.addEventListener('input', e => {
  const el = e.target.closest ? e.target.closest('[data-on]') : null;
  if (el && handlers[el.dataset.on]) handlers[el.dataset.on](el, e);
  onBind(e);
});
document.addEventListener('change', e => {
  onBind(e);
  if (e.target.closest && e.target.closest('#quizform')) updateQCount();
});
document.addEventListener('keydown', e => {
  const t = e.target, n = t && t.dataset && t.dataset.enter;
  if (e.key === 'Enter' && n && actions[n]) { e.preventDefault(); const b = document.querySelector('[data-action="' + n + '"]'); Promise.resolve(actions[n](b, e)).catch(err => toast('เกิดข้อผิดพลาด: ' + err.message, 'bad', 5000)); }
});
window.addEventListener('hashchange', () => render());
window.addEventListener('pagehide', () => { flushSave(); saveProg(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { flushSave(); saveProg(); } });

function boot() {
  loadSession();
  loadData();
  if (SESS) { upsertAccountProfile(); applyTeacherOverlay(); }
  applyTheme(DATA.settings);
  flushQueue();
  render();
}
boot();
})();

</script>
</body>
</html>
