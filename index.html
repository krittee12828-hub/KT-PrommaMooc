actions['l-add'] = () => { const l = newLesson(); ED.course.lessons.push(l); UI.open.add('l:' + l.id); saveData(); refreshEditor(); };
actions['l-up'] = el => { keepOpen(); if (move(ED.course.lessons, +el.dataset.i, -1)) { saveData(); refreshEditor(); } };
actions['l-down'] = el => { keepOpen(); if (move(ED.course.lessons, +el.dataset.i, 1)) { saveData(); refreshEditor(); } };
actions['l-dup'] = el => {
  keepOpen(); const l = deep(ED.course.lessons[+el.dataset.i]); l.id = uid('l-'); l.title += ' (สำเนา)'; l.quiz.questions.forEach(q => { q.id = uid('q-'); });
  ED.course.lessons.splice(+el.dataset.i + 1, 0, l); saveData(); refreshEditor();
};
actions['l-del'] = async el => { const l = ED.course.lessons[+el.dataset.i]; if (await confirmDlg(`ลบบทเรียน "${l.title}"?`, { danger: true, ok: 'ลบบทเรียน' })) { keepOpen(); ED.course.lessons.splice(+el.dataset.i, 1); saveData(); refreshEditor(); } };
actions['l-bulk'] = async () => {
  const txt = await openModal({
    title: 'เพิ่มหลายบทเรียนจากลิงก์ YouTube', wide: true,
    body: `<p class="muted small">วางข้อมูลบรรทัดละ 1 บทเรียน รูปแบบ <span class="kbd">ชื่อบทเรียน | ลิงก์ YouTube</span> หรือวางเฉพาะลิงก์ก็ได้ (ระบบจะตั้งชื่อ "บทที่ N" ให้ แก้ภายหลังได้)</p>
    <textarea id="bulk-l" rows="9" placeholder="บทที่ 1 ทำความรู้จัก | https://www.youtube.com/watch?v=xxxxxxxxxxx&#10;บทที่ 2 เริ่มต้นใช้งาน | https://youtu.be/yyyyyyyyyyy"></textarea>`,
    actions: [{ label: 'ยกเลิก', value: null, cls: 'ghost' }, { label: 'เพิ่มบทเรียน', cls: 'primary', collect: m => $('#bulk-l', m).value }]
  });
  if (!txt) return;
  let n = 0, bad = 0;
  txt.split('\n').map(s => s.trim()).filter(Boolean).forEach(line => {
    const parts = line.includes('|') ? line.split('|').map(s => s.trim()) : ['', line];
    const url = parts[parts.length - 1], id = ytId(url);
    if (!id) { bad++; return; }
    const l = newLesson(); l.youtube = ytWatch(id); l.title = parts.length > 1 && parts[0] ? parts[0] : 'บทที่ ' + (ED.course.lessons.length + 1);
    ED.course.lessons.push(l); n++;
  });
  saveData(); refreshEditor(); toast(`เพิ่ม ${n} บทเรียน${bad ? ` · ข้าม ${bad} บรรทัดที่อ่านลิงก์ไม่ได้` : ''}`, bad ? '' : 'ok', 4500);
};

function parseBulk(text) {
  const blocks = text.replace(/\r/g, '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const out = []; let bad = 0;
  blocks.forEach(b => {
    const q = newQuestion(); q.choices = []; q.answer = []; const head = [];
    b.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
      const m = l.match(/^([+\-*?])\s*(.*)$/);
      if (m && m[1] === '+') { q.answer.push(q.choices.length); q.choices.push(m[2]); }
      else if (m && (m[1] === '-' || m[1] === '*')) q.choices.push(m[2]);
      else if (m && m[1] === '?') q.explanation = (q.explanation ? q.explanation + '\n' : '') + m[2];
      else head.push(l.replace(/^\d+\s*[.)]\s*/, ''));
    });
    q.text = head.join('\n');
    if (!q.text || q.choices.length < 2 || !q.answer.length) { bad++; return; }
    if (q.choices.length === 2 && q.choices[0] === 'จริง' && q.choices[1] === 'เท็จ') q.type = 'tf';
    else if (q.answer.length > 1) q.type = 'multi';
    out.push(q);
  });
  return { out, bad };
}

async function withProgress(title, fn, unit) {

  wrap.innerHTML = `<div class="modal" role="alertdialog" aria-label="${esc(title)}"><div class="modal-b" style="padding:26px 24px"><h3>${esc(title)}</h3><div class="bar-progress mt-s"><i id="pg-fill" style="width:3%"></i></div><p class="small muted mt-s mb-0" id="pg-text">กำลังเตรียม…</p></div></div>`;
  root.appendChild(wrap); document.body.classList.add('modal-open');
  const upd = (n, t) => { const f = $('#pg-fill'); if (f) f.style.width = Math.max(3, pct(n, t)) + '%'; const x = $('#pg-text'); if (x) x.textContent = `${n} / ${t} ${unit || 'บัญชี'}`; };
  try { await tick(); return await fn(upd); } finally { wrap.remove(); if (!root.children.length) document.body.classList.remove('modal-open'); }

function importPreviewHtml(pr, plan) {

  return `<div class="row mb"><span class="tag ok">ใหม่ ${plan.nNew}</span><span class="tag">อัปเดต ${plan.nUpd}</span>${plan.nSkip ? `<span class="tag gray">ข้าม ${plan.nSkip}</span>` : ''}${plan.nErr ? `<span class="tag warn">ผิดพลาด ${plan.nErr}</span>` : ''}</div>

    ${plan.nGen ? `<div class="callout">${icon('info')}<div class="small">${plan.nGen} คนไม่มีทั้งรหัสผ่านและรหัสประจำตัว — ระบบจะ<b>สุ่มรหัสผ่านให้</b> และให้ดาวน์โหลดรายชื่อพร้อมรหัสหลังนำเข้า</div></div>` : ''}
    <div class="tbl-wrap" style="max-height:320px;overflow:auto"><table class="tbl"><thead><tr><th>แถว</th><th>ชื่อ / อีเมล</th><th>บทบาท</th><th>กลุ่ม</th><th>ผลตรวจ</th></tr></thead><tbody>
    ${rows.map(i => `<tr><td>${i.line}</td><td><b>${esc(i.user.name)}</b><div class="small muted">${esc(i.user.email)}</div></td><td>${rolesTags(i.user)}</td><td>${esc(i.user.group)}</td><td>${st(i)}</td></tr>`).join('')}</tbody></table></div>
    ${pr.items.length > rows.length ? `<p class="small muted mt-s">แสดง ${rows.length} จาก ${pr.items.length} แถว</p>` : ''}
    ${hasRoster() ? `<label class="check mt"><input type="checkbox" id="imp-replace"><span><b>ลบนักเรียนที่ไม่อยู่ในไฟล์นี้</b><span class="help">ใช้เมื่อไฟล์คือรายชื่อทั้งหมดของปีนี้ — ครูและผู้ดูแลระบบจะไม่ถูกลบ</span></span></label>` : ''}`;
}
actions['u-import'] = async () => {
  const f = await pickFile('.xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); if (!f) return;
  let rows;
  try {
    if (/\.csv$/i.test(f.name)) rows = parseCSV(await readText(f));
    else if (/\.xls$/i.test(f.name)) throw new Error('ไฟล์ .xls (Excel รุ่นเก่า) ยังไม่รองรับ — เปิดใน Excel แล้ว "บันทึกเป็น" .xlsx');
    else rows = xlsxRead(await readBuf(f), TEMPLATE_SHEET).rows;
  } catch (e) { return toast('อ่านไฟล์ไม่ได้: ' + e.message, 'bad', 7000); }
  return importRosterRows(rows, f.name);
};

/* rows = header row + user rows (same layout as the Excel template) — used by Excel import and by the database */
async function importRosterRows(rows, label) {
  const pr = parseUserRows(rows);
  if (pr.missing.length) { toast(`ไม่พบคอลัมน์ "${pr.missing.join('", "')}" ในไฟล์ — ใช้ไฟล์จากเทมเพลตของระบบ (ปุ่ม "เทมเพลต Excel")`, 'bad', 7000); return false; }
  if (!pr.items.length) { toast('ไม่พบรายชื่อในไฟล์ (มีแต่แถวหัวคอลัมน์)', 'bad', 5000); return false; }
  const known = new Set((DATA.users || []).map(u => u.email)), accIds = new Set(DATA.auth.accounts.map(a => a.i));
  const isUpdate = e => known.has(e) || (!!DATA.auth.salt && accIds.has(acctIdOf(e, DATA.auth.salt)));
  const good = pr.items.filter(i => !i.skipped && !i.errors.length);
  const plan = { isUpdate, nNew: good.filter(i => !isUpdate(i.user.email)).length, nUpd: good.filter(i => isUpdate(i.user.email)).length, nSkip: pr.items.filter(i => i.skipped).length, nErr: pr.items.filter(i => !i.skipped && i.errors.length).length, nGen: good.filter(i => i.gen && !known.has(i.user.email)).length };
  if (!good.length) { await alertDlg('นำเข้าไม่ได้', importPreviewHtml(pr, plan)); return false; }
  const go = await openModal({
    title: `ตรวจสอบก่อนนำเข้า — ${label}`, wide: true, body: importPreviewHtml(pr, plan),
    actions: [{ label: 'ยกเลิก', value: null, cls: 'ghost' }, { label: `นำเข้า ${good.length} รายการ`, cls: 'primary', collect: m => ({ replace: !!($('#imp-replace', m) && $('#imp-replace', m).checked) }) }]
  });
  if (!go) return false;
  const out = await withProgress('กำลังเข้ารหัสบัญชี…', async upd => {
    ensureRoster(); const imported = [], inFile = new Set(pr.items.filter(i => EMAIL_RE.test(i.user.email)).map(i => i.user.email));
    good.forEach(i => {
      const ex = findUser(i.user.email);
      if (i.gen) i.user.password = ex ? ex.password : genPassword();
      upsertUser(i.user); imported.push(findUser(i.user.email));
    });
    let removed = 0;
    if (go.replace) { const before = DATA.users.length; DATA.users = DATA.users.filter(u => u.role !== 'student' || inFile.has(u.email)); removed = before - DATA.users.length; }
    await syncAccounts(upd); saveData();
    return { imported, removed };
  });
  redrawUsers();
  const generated = good.filter(i => i.gen && !known.has(i.user.email)).length;
  const v = await openModal({

/* =====================================================================
   Images — pick, shrink, keep (Google Drive / inside the site / a link), show
   A picture is stored as ONE string in the data:
     "drive:<file id>"          a file in the administrator's Google Drive (uploaded through the database script)
     "data:image/…;base64,…"    shrunk and embedded in the site data (used when Drive is not available, and by teachers)
     "https://…"                a link to a picture somewhere else
   ===================================================================== */
const IMG_MIME = /^image\/(png|jpe?g|gif|webp|bmp|svg\+xml)$/i;
const DRIVE_ID = /^[\w-]{10,90}$/;
const IMGMEM = {};   // ref → data URL: a fresh upload is shown at once (Drive needs a moment to make its thumbnails)

function imgSrc(ref, w) {
  ref = String(ref || '').trim(); if (!ref) return '';
  if (IMGMEM[ref]) return IMGMEM[ref];
  if (ref.slice(0, 6) === 'drive:') { const id = ref.slice(6); return DRIVE_ID.test(id) ? `https://drive.google.com/thumbnail?id=${id}&sz=w${w || 1200}` : ''; }
  if (/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(ref)) return ref;
  return /^https:\/\/[^\s"'<>]+$/i.test(ref) ? ref : '';
}
function imgTag(ref, o) {
  o = o || {}; const s = imgSrc(ref, o.w); if (!s) return '';
  const id = String(ref).slice(0, 6) === 'drive:' ? String(ref).slice(6) : '';
  return `<img ${o.cls ? `class="${o.cls}"` : ''} src="${esc(s)}" alt="${esc(o.alt || '')}" ${id ? `data-d="${esc(id)}" data-w="${o.w || 1200}"` : ''} ${o.rm ? 'data-rm="1"' : ''} ${o.lazy === false ? '' : 'loading="lazy"'} decoding="async" referrerpolicy="no-referrer">`;
}
// a Drive thumbnail that fails gets one more chance through the second Google address; a picture that still fails is hidden
document.addEventListener('error', e => {
  const im = e.target; if (!im || im.tagName !== 'IMG') return;
  if (im.dataset.d && !im.dataset.alt) { im.dataset.alt = '1'; im.src = `https://lh3.googleusercontent.com/d/${im.dataset.d}=w${im.dataset.w || 1200}`; return; }
  if (im.dataset.rm) im.remove(); else im.classList.add('broken');
}, true);

/* a link pasted by a person → a stored reference ('' when it is not usable) */
function parseImgLink(u) {
  u = String(u || '').trim(); if (!u) return '';
  const m = u.match(/drive\.google\.com\/file\/d\/([\w-]{10,})/) || u.match(/drive\.google\.com\/(?:open|uc|thumbnail)\?[^#\s]*\bid=([\w-]{10,})/) || u.match(/lh3\.googleusercontent\.com\/d\/([\w-]{10,})/);
  if (m) return 'drive:' + m[1];
  return /^https:\/\/[^\s"'<>]+$/i.test(u) ? u : '';
}
function imgBadge(ref) {
  ref = String(ref || '');
  if (ref.slice(0, 6) === 'drive:') return `<span class="tag ok">${icon('check', 13)} เก็บใน Google Drive</span>`;
  if (ref.slice(0, 5) === 'data:') return `<span class="tag gray">ฝังในระบบ · ${Math.max(1, Math.round(ref.length * 0.75 / 1024))} KB</span>`;
  if (ref) return '<span class="tag gray">ลิงก์รูปภายนอก</span>';
  return '';
}

/* ---------- shrink in the browser ---------- */
function loadBitmap(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('อ่านไฟล์รูปไม่ได้ — ลองใช้ไฟล์ JPG หรือ PNG')); };
    im.src = u;
  });
}
const dataUrlBytes = u => Math.round((u.length - u.indexOf(',') - 1) * 0.75);
/* o: { max: longest side in px, q: JPEG quality, kb: aim for at most this many KB } → { dataUrl, mime } */
async function shrinkImage(file, o) {
  const im = await loadBitmap(file), w0 = im.naturalWidth || im.width, h0 = im.naturalHeight || im.height;
  if (!w0 || !h0) throw new Error('อ่านไฟล์รูปไม่ได้');
  let scale = Math.min(1, o.max / Math.max(w0, h0)), q = o.q || 0.85;
  const wantPng = /png|gif|webp|svg/i.test(file.type);
  const draw = (sc, png) => {
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w0 * sc)); c.height = Math.max(1, Math.round(h0 * sc));
    const x = c.getContext('2d'); if (!png) { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
    x.drawImage(im, 0, 0, c.width, c.height); return c;
  };
  let out;
  if (wantPng) {   // keep transparency while the file stays small
    out = draw(scale, true).toDataURL('image/png');
    if (dataUrlBytes(out) <= Math.min(o.kb || 1e9, 900) * 1024) return { dataUrl: out, mime: 'image/png' };
  }
  for (let i = 0; i < 6; i++) {
    out = draw(scale, false).toDataURL('image/jpeg', q);
    if (dataUrlBytes(out) <= (o.kb || 1e9) * 1024) break;
    if (q > 0.56) q -= 0.09; else scale *= 0.85;
  }
  return { dataUrl: out, mime: 'image/jpeg' };
}

/* ---------- keep it somewhere ---------- */
const driveBlocked = () => !!(DBS.st && DBS.st.drive === false) || DBS.driveOff === true;
function driveWhy(e) {
  return e && e.code === 'drive_denied' ? 'สคริปต์ยังไม่ได้รับอนุญาตให้ใช้ Google Drive'
    : e && e.code === 'share_blocked' ? 'บัญชี Google นี้ไม่อนุญาตให้แชร์รูปแบบ "ทุกคนที่มีลิงก์" (มักเป็นนโยบายของโรงเรียน)'
    : (e && e.message) || 'อัปโหลดไม่สำเร็จ';
}
/* → { ref, where: 'drive' | 'embed', note } — never throws because of Drive: it falls back to embedding the picture */
async function storeImage(file, o) {
  o = o || {};
  if (!file || !IMG_MIME.test(file.type || '')) throw new Error('ไฟล์นี้ไม่ใช่รูปภาพ — ใช้ไฟล์ JPG, PNG, GIF หรือ WEBP');
  if (file.size > 25e6) throw new Error('ไฟล์ใหญ่เกิน 25 MB');
  let note = '';
  if (!o.embed && dbReady() && (DATA.settings.imgDrive !== false)) {
    if (driveBlocked()) note = 'Drive ยังใช้ไม่ได้ (ดูที่หน้า "เชื่อมต่อฐานข้อมูล")';
    else {
      try {
        const big = await shrinkImage(file, { max: o.max || 1600, q: 0.86, kb: 1000 });
        const r = await dbCall('img_put', { name: file.name, mime: big.mime, data: big.dataUrl.split(',')[1] }, { timeout: 90000 });
        const ref = 'drive:' + r.id; IMGMEM[ref] = big.dataUrl;
        return { ref, where: 'drive', note: '' };
      } catch (e) {
        if (e.code === 'drive_denied' || e.code === 'share_blocked') DBS.driveOff = true;
        note = driveWhy(e);
      }
    }
  }
  const small = await shrinkImage(file, { max: Math.min(o.max || 1000, 1000), q: 0.78, kb: 170 });
  return { ref: small.dataUrl, where: 'embed', note };
}

function imageSlots() {   // [{ get, set }] for every picture that may live in Drive

  add(DATA.settings, 'heroImage');

  });

}
const isEmbedded = v => typeof v === 'string' && v.slice(0, 11) === 'data:image/' && v.length > 6000;
async function migrateImages(upd) {
  const todo = imageSlots().filter(s => isEmbedded(s.o[s.k])); let n = 0, fail = '';
  if (!todo.length || driveBlocked()) return { moved: 0, left: todo.length, fail };
  const cache = {};
  for (const s of todo) {
    const v = s.o[s.k];
    try {
      if (!cache[v]) {
        const mime = (v.match(/^data:(image\/[a-z]+);/i) || [])[1] || 'image/jpeg';
        const r = await dbCall('img_put', { name: 'moved', mime, data: v.split(',')[1] }, { timeout: 90000 });
        cache[v] = 'drive:' + r.id; IMGMEM[cache[v]] = v;
      }
      s.o[s.k] = cache[v]; n++; if (upd) upd(n, todo.length);
    } catch (e) { fail = driveWhy(e); if (e.code === 'drive_denied' || e.code === 'share_blocked') DBS.driveOff = true; break; }
  }
  if (n) { flushSave(); saveData(); }
  return { moved: n, left: todo.length - n, fail };
}

/* =====================================================================
   Database layer — Google Sheets through the Apps Script web app (apps_script.gs)
   - public:  a teacher sign-up request is sent straight to the sheet "requests"
   - admin:   the secret key (kept ONLY in this browser, never in index.html) unlocks
              requests → inbox notification, approve/reject status, roster save / load
   Nothing here is required: without a Webhook URL everything falls back to files / codes.
   ===================================================================== */
const DB_KEY = 'pmooc.dbkey.v1', DB_META = 'pmooc.dbmeta.v1', DB_SKIP = 'pmooc.dbskip.v1';
const dbUrl = () => String(DATA.settings.webhookUrl || '').trim();
const dbKey = () => String(store.get(DB_KEY, '') || '');
const dbReady = () => isAdmin() && /^https:\/\//.test(dbUrl()) && dbKey().length >= 8;
const dbMeta = () => store.get(DB_META, {}) || {};
const setDbMeta = o => store.set(DB_META, Object.assign(dbMeta(), o));
const saveLocalOnly = () => { store.set(LS.data, { data: DATA }); };   // admin-only lists (inbox…): kept without marking the site "unpublished"
const DBS = { reqBusy: false, req: null, pulling: false, pushErr: '', st: null, driveOff: false };   // req: { ok, at, err } · st: last answer of the script's "status" (version, Drive, last publish)
const JSON_HDR = { 'Content-Type': 'text/plain;charset=utf-8' };   // text/plain = no CORS pre-flight (Apps Script cannot answer one)

const DB_ERR = {
  unauthorized: 'รหัสลับของผู้ดูแลไม่ตรงกับที่ตั้งไว้ในสคริปต์ — ตรวจที่ ตั้งค่าเว็บไซต์ → ฐานข้อมูล',
  empty: 'รายชื่อว่างเปล่า — ระบบไม่บันทึกทับฐานข้อมูล',
  invalid: 'ข้อมูลไม่ถูกต้อง', not_found: 'ไม่พบรายการนี้ในฐานข้อมูล', full: 'มีคำขอค้างอยู่มากเกินไป กรุณาลองใหม่ภายหลัง',
  unknown_action: 'สคริปต์ยังเป็นเวอร์ชันเก่า — คัดลอกโค้ดใหม่ไปวาง แล้ว Deploy เป็นเวอร์ชันใหม่',
  drive_denied: 'สคริปต์ยังไม่ได้รับอนุญาตให้ใช้ Google Drive — เปิด Apps Script เลือกฟังก์ชัน setup แล้วกด "เรียกใช้" หนึ่งครั้ง จากนั้นกดอนุญาต',
  share_blocked: 'บัญชี Google นี้ไม่อนุญาตให้แชร์รูปแบบ "ทุกคนที่มีลิงก์" (มักเป็นนโยบายของโรงเรียน) — ระบบจะฝังรูปไว้ในเว็บแทน',
  too_big: 'ข้อมูลใหญ่เกินกว่าที่ฐานข้อมูลรับได้ — ย้ายรูปที่ฝังไว้ไปไว้ใน Google Drive หรือลดจำนวนรูป',
  busy: 'ฐานข้อมูลกำลังอัปเดต กรุณาลองใหม่อีกครั้ง'
};
const OLD_SCRIPT = 'สคริปต์ที่ใช้อยู่เป็นเวอร์ชันเก่าหรือ URL ไม่ถูกต้อง — คัดลอกโค้ดเวอร์ชันใหม่ไปวาง แล้ว Deploy เป็นเวอร์ชันใหม่';

/* administrator call: POST, answer is read back as JSON */
async function dbCall(action, payload, o) {
  const url = dbUrl(); if (!url) throw new Error('ยังไม่ได้ใส่ Webhook URL');
  const ctl = typeof AbortController === 'function' ? new AbortController() : null, tm = setTimeout(() => { if (ctl) ctl.abort(); }, (o && o.timeout) || 25000);
  let text;
  try {
    const res = await fetch(url, { method: 'POST', headers: JSON_HDR, body: JSON.stringify(Object.assign({ action, key: dbKey() }, payload || {})), signal: ctl ? ctl.signal : undefined });
    text = await res.text();
  } catch (e) { throw new Error(e && e.name === 'AbortError' ? 'ฐานข้อมูลตอบช้าเกินไป ลองใหม่อีกครั้ง' : 'เชื่อมต่อฐานข้อมูลไม่ได้ — ตรวจอินเทอร์เน็ต และตรวจว่า Deploy แบบ "ทุกคน (Anyone)"'); }
  finally { clearTimeout(tm); }
  let j; try { j = JSON.parse(text); } catch (e) { throw new Error(OLD_SCRIPT); }
  if (!j || !j.ok) { const er = new Error(DB_ERR[j && j.error] || 'ฐานข้อมูลปฏิเสธคำสั่ง (' + (j && j.error) + ')'); er.code = j && j.error; er.detail = j && j.detail; throw er; }
  return j;
}

/* public call: a teacher asks for an account. → 'sent' | 'unverified' | 'failed' | 'none' */
async function dbSendRequest(person, hp) {
  const url = dbUrl(); if (!/^https:\/\//.test(url)) return 'none';
  const body = JSON.stringify({ event: 'teacher_request', person, hp: hp || '', at: new Date().toISOString(), site: DATA.settings.siteName });
  let text;
  try { const res = await fetch(url, { method: 'POST', headers: JSON_HDR, body }); text = await res.text(); }
  catch (e) {   // network error or the browser would not let us read the answer — try once more blind (the script de-duplicates by e-mail)
    try { await fetch(url, { method: 'POST', mode: 'no-cors', headers: JSON_HDR, body }); return 'unverified'; } catch (e2) { return 'failed'; }
  }
  try { const j = JSON.parse(text); return j && j.ok ? 'sent' : 'failed'; } catch (e) { return 'unverified'; }   // not JSON = old script version
}

async function dbSyncRequests(o) {

    const j = await dbCall('requests'), skip = new Set(skipList());

    DATA.inbox = DATA.inbox.filter(x => !(x.rid && !ids.has(x.rid)));   // decided somewhere else
    const removed = before - DATA.inbox.length;
    for (const it of remote) {
      let p; try { p = cleanReq(it.person); } catch (e) { continue; }
      if (!EMAIL_RE.test(p.email) || p.name.length < 2) continue;
      const ex = findUser(p.email);
      if (ex && hasRole(ex, 'teacher')) { dbMark(it.id, 'approved'); continue; }   // already a teacher (or an admin who teaches): close the stale request — an admin without the teacher hat stays in the inbox so it can be approved
      if (DATA.inbox.some(x => x.rid === it.id)) continue;

/* =====================================================================
   Live site data — publish through the database, every browser follows it
   • The administrator presses "เผยแพร่": the same data that goes into index.html is saved in the sheet "site".
   • Every visitor's browser asks the script for it (cheap "nothing new" answer when unchanged) and uses the newest copy,
     so courses, announcements and new accounts reach everyone without uploading index.html to GitHub again.
   • The page always opens from the copy it already has (file or the last copy kept in the browser) — never blocked by the network.
   ===================================================================== */
const SITE = { busy: false, pending: null, seenAt: '', last: 0, err: '', timer: null, pubBusy: false, qt: null, autoErr: '' };
const siteLive = () => /^https:\/\//.test(BAKED.url) && (BAKED.live || !!store.get(LS.remote, null));

function cacheRemote(at, data) {
  const rec = { at: String(at), url: BAKED.url, salt: BAKED.salt, data };
  let ok = true; try { ok = JSON.stringify(rec).length < 3.2e6 && store.set(LS.remote, rec); } catch (e) { ok = false; }
  if (!ok) store.del(LS.remote);
  SITE.seenAt = String(at);
}

/* ---------- visitors: follow the published copy ---------- */
function siteCanApplyNow() {
  const path = currentPath();
  if (/^\/learn\//.test(path) || document.body.classList.contains('modal-open')) return false;   // never swap the data under a lesson, a quiz or a dialog
  if (isStaff() && (/^\/admin\/(course\/|new)/.test(path) || isDirty())) return false;           // never over somebody's unpublished edits
  return true;
}
function siteCommit(p) {
  EMBEDDED = normData(deep(p.data));
  cacheRemote(p.at, p.data);
  loadData(); applyTeacherOverlay(); applyTheme(DATA.settings);
}
function siteApplyPending() {
  const p = SITE.pending; if (!p || !siteCanApplyNow()) return false;
  SITE.pending = null; siteCommit(p); return true;
}
/* → 'new' (a newer copy is now in use) | 'pending' (downloaded, will be used at the next page change) | 'same' | 'none' | null (not possible now) */
async function siteFetch(o) {
  o = o || {};
  if (!siteLive() || SITE.busy) return null;
  SITE.busy = true;
  const ctl = typeof AbortController === 'function' ? new AbortController() : null, tm = setTimeout(() => { if (ctl) ctl.abort(); }, 20000);
  try {
    const rec = store.get(LS.remote, null), have = SITE.seenAt || (rec && rec.at) || '';
    const res = await fetch(BAKED.url + (BAKED.url.indexOf('?') >= 0 ? '&' : '?') + 'a=site' + (have && !o.force ? '&since=' + encodeURIComponent(have) : ''), { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
    const j = JSON.parse(await res.text());
    SITE.last = Date.now(); SITE.err = '';
    if (!j || !j.ok) { SITE.err = (j && j.error) || 'bad'; return null; }
    if (j.empty) return 'none';
    if (j.same) { SITE.seenAt = String(j.at); return 'same'; }
    const data = JSON.parse(j.data);
    if (!data || !Array.isArray(data.courses) || !data.settings || typeof data.settings !== 'object') throw new Error('bad data');
    SITE.seenAt = String(j.at);
    if ((data.updatedAt || 0) <= BAKED.at) return 'none';   // older than the file this browser opened: never go backwards
    SITE.pending = { at: j.at, data };
    if (siteApplyPending()) { if (!o.noRender) { if (isStaff()) pubChipUpdate(); rerender(); } return 'new'; }
    return 'pending';
  } catch (e) { SITE.err = e.name === 'AbortError' ? 'timeout' : (e.message || 'error'); return null; }
  finally { clearTimeout(tm); SITE.busy = false; }
}
function startSiteWatch() {
  if (SITE.timer || !siteLive()) return;
  setTimeout(() => siteFetch(), 300);
  SITE.timer = setInterval(() => { if (!document.hidden) siteFetch(); }, 120000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - SITE.last > 45000) siteFetch(); });
  window.addEventListener('online', () => siteFetch());
}

const lessonLabel = (c, i) => `บทที่ ${i + 1} ${c.lessons[i].title}`;
function courseFunnel(c, rows) {
  const st = [{ name: 'ลงทะเบียนเรียน', n: rows.length }];
  if (preOn(c)) st.push({ name: 'ทำแบบทดสอบก่อนเรียน', n: rows.filter(r => r.v.pre).length });
  if (c.lessons.length) st.push({ name: 'เรียนจบอย่างน้อย 1 บท', n: rows.filter(r => r.st.doneLessons >= 1).length }, { name: `เรียนครบทุกบท (${c.lessons.length} บท)`, n: rows.filter(r => r.st.allLessons).length });
  if (postOn(c)) st.push({ name: 'ผ่านแบบทดสอบหลังเรียน', n: rows.filter(r => r.v.post.passed).length });
  st.push({ name: 'เรียนจบหลักสูตร', n: rows.filter(r => r.state === 'done').length });
  const tot = rows.length || 1, ramp = [BLUE[250], BLUE[300], BLUE[350], BLUE[450], BLUE[500], BLUE[550]];
  return `<div class="funnel">${st.map((x, i) => { const p = Math.round(x.n / tot * 100), prev = i ? st[i - 1].n : null, drop = prev != null && prev > x.n ? prev - x.n : 0;
    return `<div class="fn" ${tipAttr(`${x.n} คน (${p}% ของผู้ลงทะเบียน)\n${x.name}${drop ? `\nลดลงจากขั้นก่อนหน้า ${drop} คน` : ''}`)}><div class="vb-l">${esc(x.name)}</div><div class="vb-t"><i style="width:${p}%;background:${ramp[Math.min(ramp.length - 1, Math.round(i * (ramp.length - 1) / Math.max(1, st.length - 1)))]}"></i></div><b class="vb-v">${x.n}</b><span class="fd">${drop ? '−' + drop : ''}</span></div>`; }).join('')}</div>`;
}
function lessonStats(c, rows) {

function itemStats(c, rows) {

/* ---------- health check: asks the script, explains every answer ---------- */
async function dbHealth() {
  const out = [], add = (state, t) => out.push({ state, t }), url = dbUrl();
  if (!/^https:\/\//.test(url)) { add('bad', 'ยังไม่ได้ใส่ URL ของ Web app (ต้องขึ้นต้นด้วย https://)'); return out; }
  if (/\/dev(\?|$)/.test(url)) add('warn', 'URL นี้ลงท้ายด้วย /dev (ใช้ทดสอบเฉพาะเจ้าของ) — ต้องใช้ลิงก์ Web app ที่ลงท้ายด้วย /exec');
  if (dbKey().length < 8) { add('bad', 'ยังไม่ได้ตั้งรหัสลับ (อย่างน้อย 8 ตัวอักษร)'); return out; }
  let j; try { j = await dbCall('status'); } catch (e) { add('bad', e.message); DBS.st = null; return out; }
  DBS.st = j; if (j.drive !== false) DBS.driveOff = false;
  add('ok', 'เชื่อมต่อสคริปต์ได้ และรหัสลับตรงกัน');
  if (j.v >= 3) {
    add(j.v >= 4 ? 'ok' : 'warn', j.v >= 4 ? `สคริปต์เป็นเวอร์ชัน ${j.v} (ล่าสุด) — ออกเลขที่เกียรติบัตรอัตโนมัติได้` : `สคริปต์เป็นเวอร์ชัน ${j.v} — ใช้งานได้ แต่ยังออกเลขที่เกียรติบัตรอัตโนมัติไม่ได้ (วางโค้ดเวอร์ชัน 4 ทับของเดิม แล้ว Deploy → Manage deployments → New version)`);
    add(j.drive ? 'ok' : 'warn', j.drive ? 'Google Drive พร้อมเก็บรูปภาพ' : 'ยังไม่ได้อนุญาตสิทธิ์ Google Drive — กลับไปที่ขั้น ③ เลือกฟังก์ชัน setup แล้วกด "เรียกใช้" อีกครั้ง (ถ้าไม่ทำ ระบบจะฝังรูปไว้ในเว็บแทน)');
    add(j.site ? 'ok' : 'warn', j.site ? `เผยแพร่ล่าสุด ${fmtDT(j.site)}` : 'ยังไม่เคยเผยแพร่ข้อมูลเว็บผ่านฐานข้อมูล — ทำที่ขั้น ⑥');
  } else add('warn', 'สคริปต์เป็นเวอร์ชันเก่า (ผลการเรียน คำขอสมัครครู และรายชื่อใช้ได้ แต่ยังเผยแพร่ผ่านฐานข้อมูลและเก็บรูปใน Drive ไม่ได้) — คัดลอกสคริปต์ใหม่ไปวางทับ แล้ว Deploy เป็นเวอร์ชันใหม่');
  add('ok', `คำขอสมัครครูที่รอตรวจ ${j.pending} รายการ · รายชื่อในฐานข้อมูล ${j.users} คน`);
  return out;
}
const healthIcon = s => (s === 'ok' ? `<span class="hs ok">${icon('check', 15)}</span>` : s === 'warn' ? `<span class="hs warn">${icon('alert', 15)}</span>` : `<span class="hs bad">${icon('x', 15)}</span>`);

}

function certPassers(cid) {

    out.set(k, { key: k, kind: 'manual', m, cid: c.id, c, name: m.name, email: m.email, org: m.org, group: m.group, sid: '', role: m.role || 'ผู้เรียน', at: m.at, pre: m.pre, post: m.post, certId: m.certId, n: cert && cert.n || null, no: cert && cert.no || '', series: cert && cert.series || '', src: cert ? cert.src : '', status: cert && cert.status === 'void' ? 'void' : 'ok' });

function parseLessonLines(text) {
  const out = [];
  String(text || '').split('\n').forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const parts = line.includes('|') ? line.split('|').map(s => s.trim()) : ['', line], url = parts[parts.length - 1], id = ytId(url);
    out.push({ line: i + 1, title: parts.length > 1 && parts[0] ? parts[0] : '', url, id, ok: !!id });
  });
  let n = 0; out.forEach(x => { if (x.ok) { n++; if (!x.title) x.title = 'บทที่ ' + n; } });
  return out;
}
const wzLessons = () => parseLessonLines(WZ.lessonsText).filter(x => x.ok);

};

  else d = JSON.parse(t);
  if (!d || d.app !== 'prommamooc' || d.kind !== 'teacher-request' || !d.person) throw new Error('ไม่ใช่คำขอสมัครครูของ PrommaMooc');
  const p = cleanReq(d.person); if (!EMAIL_RE.test(p.email) || p.name.length < 2) throw new Error('คำขอไม่ครบถ้วน (ต้องมีชื่อและอีเมล)');
  return { person: p, at: Date.parse(d.at) || Date.now() };
}
let TS_DONE = null, TS_STATE = '', TS_BUSY = false;   // TS_STATE: sent | unverified | failed | none
route(/^\/teacher-signup$/, () => {
  const S = DATA.settings;
  if (TS_DONE) {
    const sent = TS_STATE === 'sent', unv = TS_STATE === 'unverified';
    const head = sent ? `<div class="callout ok">${icon('checkc')}<div class="small"><b>ส่งคำขอถึงผู้ดูแลระบบแล้ว</b> — ผู้ดูแลจะได้รับแจ้งเตือนในส่วนจัดการระบบ เมื่อตรวจสอบและอนุมัติแล้วจะส่งอีเมลและรหัสผ่านสำหรับเข้าสู่ระบบมาให้คุณ</div></div>`
      : unv ? `<div class="callout warn">${icon('alert')}<div class="small"><b>ส่งคำขอแล้ว แต่ยืนยันการรับไม่ได้</b> — เพื่อความมั่นใจ แจ้งผู้ดูแลอีกทางหนึ่งด้วย (ส่งไฟล์หรือรหัสด้านล่างให้ผู้ดูแล)</div></div>`
      : `<div class="callout warn">${icon('alert')}<div class="small"><b>ยังไม่ได้ส่งถึงผู้ดูแลระบบ</b> — ${TS_STATE === 'failed' ? 'ส่งไม่สำเร็จ (ตรวจอินเทอร์เน็ตแล้วลองใหม่ หรือ' : 'เว็บนี้ยังไม่ได้เชื่อมต่อฐานข้อมูล'} กรุณาส่งไฟล์หรือรหัสด้านล่างให้ผู้ดูแล (LINE / อีเมล / ฝากไว้ที่ห้องธุรการ) ผู้ดูแลจะตรวจสอบแล้วส่งรหัสผ่านเข้าสู่ระบบกลับให้คุณ${TS_STATE === 'failed' ? ')' : ''}</div></div>`;
    const backup = `<div class="row"><button class="btn ${sent ? '' : 'primary'}" data-action="ts-download">${icon('download', 18)} ดาวน์โหลดไฟล์คำขอ</button><button class="btn" data-action="ts-copy">${icon('copy', 18)} คัดลอกรหัสคำขอ</button></div>
      <p class="small muted mt">รหัสคำขอคือข้อความยาว ๆ ขึ้นต้นด้วย <span class="kbd">${REQ_PREFIX}</span> วางในแชตส่งให้ผู้ดูแลได้เลย (ไม่มีรหัสผ่านอยู่ในนั้น)</p>`;
    return {
      title: 'ส่งคำขอสมัครครู', html: `<div class="wrap" style="max-width:640px"><div class="panel mt"><div class="center"><div class="big" style="font-size:2.4rem">${sent ? '✅' : '📨'}</div><h2>${sent ? 'ส่งคำขอเรียบร้อยแล้ว' : 'สร้างคำขอเรียบร้อยแล้ว'}</h2></div>
      ${head}${sent ? `<details><summary style="cursor:pointer" class="small muted">ส่งสำรองให้ผู้ดูแลด้วยตัวเอง (ไม่จำเป็น)</summary><div class="mt-s">${backup}</div></details>` : backup}
      <div class="row between mt"><a class="btn ghost" href="#/login">ไปหน้าเข้าสู่ระบบ</a><button class="btn ghost" data-action="ts-again">กรอกคำขอใหม่</button></div></div></div>`
    };
  }
  const live = /^https:\/\//.test(dbUrl());
  return {
    title: 'ขอสมัครเป็นครูผู้สอน', html: `<div class="wrap" style="max-width:640px"><div class="panel mt"><h2>ขอสมัครเป็นครูผู้สอน</h2>
      <p class="muted">กรอกข้อมูลเพื่อขอสิทธิ์สร้างคอร์สใน ${esc(S.orgName || S.siteName)} — ผู้ดูแลระบบจะตรวจสอบและสร้างบัญชีให้ คุณจะได้รับอีเมลและรหัสผ่านสำหรับเข้าสู่ระบบ</p>
      <label class="field"><span class="lb">ชื่อ–นามสกุล <span class="req">*</span></span><input type="text" id="ts-name" autocomplete="name"></label>
      <label class="field"><span class="lb">อีเมล <span class="req">*</span></span><input type="email" id="ts-email" autocomplete="email" autocapitalize="off" spellcheck="false" inputmode="email"><span class="help">ใช้เป็นชื่อผู้ใช้ตอนเข้าสู่ระบบ</span></label>
      <div class="grid2"><label class="field"><span class="lb">โรงเรียน / หน่วยงาน</span><input type="text" id="ts-org" value="${esc(S.orgName || '')}"></label><label class="field"><span class="lb">เบอร์โทรติดต่อ</span><input type="tel" id="ts-phone" autocomplete="tel" inputmode="tel"></label></div>
      <label class="field"><span class="lb">วิชา / หัวข้อที่จะสอน</span><input type="text" id="ts-subject" placeholder="เช่น คณิตศาสตร์ ม.ต้น"></label>
      <label class="field"><span class="lb">หมายเหตุถึงผู้ดูแล</span><textarea id="ts-note" rows="3"></textarea></label>
      <div class="hp" aria-hidden="true"><label>เว็บไซต์ (เว้นว่าง)<input type="text" id="ts-web" tabindex="-1" autocomplete="off"></label></div>
      <button class="btn primary lg" data-action="ts-make" style="width:100%">${live ? 'ส่งคำขอสมัคร' : 'สร้างคำขอสมัคร'}</button>
      <p class="help center mt-s">${live ? 'คำขอจะถูกส่งถึงผู้ดูแลระบบทันที และผู้ดูแลจะได้รับแจ้งเตือน' : 'ข้อมูลนี้ไม่ถูกส่งออกจากเครื่องคุณ จนกว่าคุณจะส่งไฟล์ให้ผู้ดูแลเอง'}</p></div></div>`,
    mount() { const e = $('#ts-name'); if (e) e.focus(); }
  };
});
actions['ts-make'] = async () => {
  if (TS_BUSY) return;
  const r = cleanReq({ name: $('#ts-name').value, email: $('#ts-email').value, org: $('#ts-org').value, phone: $('#ts-phone').value, subject: $('#ts-subject').value, note: $('#ts-note').value });
  if (r.name.length < 2) return toast('กรุณากรอกชื่อ–นามสกุล', 'bad');
  if (!EMAIL_RE.test(r.email)) return toast('รูปแบบอีเมลไม่ถูกต้อง', 'bad');
  const hp = ($('#ts-web') || {}).value || '', btn = document.querySelector('[data-action="ts-make"]');
  TS_BUSY = true; if (btn) { btn.disabled = true; btn.textContent = 'กำลังส่งคำขอ…'; }
  try { TS_STATE = await dbSendRequest(r, hp); } finally { TS_BUSY = false; }
  TS_DONE = r; rerender(); window.scrollTo(0, 0);
};
actions['ts-download'] = () => { if (!TS_DONE) return; downloadText('teacher-request-' + TS_DONE.email.replace(/[^a-z0-9]+/g, '_') + '.pmooc.json', JSON.stringify({ app: 'prommamooc', kind: 'teacher-request', v: 1, at: new Date().toISOString(), person: TS_DONE }), 'application/json'); toast('ดาวน์โหลดไฟล์คำขอแล้ว — ส่งให้ผู้ดูแลระบบ', 'ok', 5000); };
actions['ts-copy'] = async () => { if (!TS_DONE) return; toast((await copyText(reqToText(TS_DONE))) ? 'คัดลอกรหัสคำขอแล้ว — วางส่งให้ผู้ดูแลได้เลย' : 'คัดลอกไม่สำเร็จ ใช้ปุ่มดาวน์โหลดไฟล์แทน', 'ok', 5000); };
actions['ts-again'] = () => { TS_DONE = null; TS_STATE = ''; rerender(); };


/* =====================================================================
   Global events + boot
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (!fn) return;
  try {
    const r = fn(el, e);
    if (r && typeof r.catch === 'function') r.catch(err => { console.error(err); toast('เกิดข้อผิดพลาด: ' + err.message, 'bad', 5000); });
  } catch (err) { console.error(err); toast('เกิดข้อผิดพลาด: ' + err.message, 'bad', 5000); }
});
document.addEventListener('input', e => {
  const el = e.target.closest ? e.target.closest('[data-on]') : null;
  if (el && handlers[el.dataset.on]) handlers[el.dataset.on](el, e);
  onBind(e);
});
document.addEventListener('change', e => {
  onBind(e);
  if (e.target.closest && e.target.closest('#quizform')) updateQCount();
});
document.addEventListener('keydown', e => {
  const t = e.target, n = t && t.dataset && t.dataset.enter;
  if (e.key === 'Enter' && n && actions[n]) { e.preventDefault(); const b = document.querySelector('[data-action="' + n + '"]'); Promise.resolve(actions[n](b, e)).catch(err => toast('เกิดข้อผิดพลาด: ' + err.message, 'bad', 5000)); }
});
window.addEventListener('hashchange', () => render());
window.addEventListener('pagehide', () => { flushSave(); saveProg(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { flushSave(); saveProg(); } });

function boot() {
  loadSession();
  loadData();
  if (SESS) { upsertAccountProfile(); applyTeacherOverlay(); }
  applyTheme(DATA.settings);
  flushQueue();
  render();
  startDbWatch();
  startSiteWatch();
}
boot();
})();

</script>
